<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자습감독표 관리</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#f5f3ee;
    --panel:#ffffff;
    --line:#dfd9cc;
    --veritas:#1d5fd6;
    --veritas-bg:#dde8fb;
    --gyosa:#d9560c;
    --gyosa-bg:#fbe6d6;
    --accent:#b5542a;
    --accent-bg:#f6e6dc;
    --off:#9a9488;
    --off-bg:#eeece5;
    --danger:#b0413e;
    --radius:10px;

  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;

  header{
    padding:22px 24px 16px; border-bottom:2px solid var(--ink); background:var(--panel);
    position:sticky; top:0; z-index:20;
  }
  header h1{ margin:0 0 4px; font-size:20px; letter-spacing:-0.02em; }
  header .sub{ color:#6b6455; font-size:12.5px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn{
    padding:7px 14px; border-radius:999px; border:1.5px solid var(--ink); background:transparent;
    font-size:13px; cursor:pointer; color:var(--ink); font-weight:600;
  }
  .tab-btn.active{ background:var(--ink); color:#fff; }
  .spacer{flex:1;}
  .btn{
    padding:7px 13px; border-radius:8px; border:1.5px solid var(--ink); background:var(--panel);
    font-size:12.5px; cursor:pointer; font-weight:600; color:var(--ink);
  }
  .btn:hover{ background:#efece3; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ border-color:var(--danger); color:var(--danger); }
  .btn.small{ padding:4px 9px; font-size:11px; }
  .btn.toggle-on{ background:var(--ink); color:#fff; }
  .btn.icon{ padding:6px 10px; font-size:14px; line-height:1; }
  main{ padding:20px 24px 60px; max-width:1400px; margin:0 auto; }
  .panel{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:18px;
  }
  .panel h2{ margin:0 0 12px; font-size:15px; }
  .hint{ font-size:12px; color:#847d6c; margin:0 0 12px; }

  table.grid th, table.grid td{ border:1px solid var(--line); padding:6px 8px; text-align:center; white-space:nowrap; }
  table.grid thead th{ background:#efeadf; position:sticky; top:0; }
  table.grid .date-col{ text-align:left; position:sticky; left:0; background:#efeadf; font-weight:600; min-width:150px; }
  table.grid tbody tr:nth-child(even) td:not(.date-col){ background:#fbfaf6; }
  table.grid .name-input{
    width:100%; border:none; background:transparent; text-align:center; font-weight:700; font-size:12.5px;
    color:var(--ink); border-radius:4px;
  }
  table.grid .name-input:focus{ background:#fff3e6; outline:1px solid var(--accent); }
  .role-tag{ display:block; font-size:10px; font-weight:500; color:#8a8373; }
  .cell{ cursor:pointer; border-radius:6px; padding:5px 4px; font-weight:700; min-width:52px; transition:transform .06s; }
  .cell:hover{ transform:scale(1.04); }
  .cell.empty{ color:#c4bfb2; }
  .cell.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .cell.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }
  .cell.selected{ outline:2.5px solid var(--accent); }
  tr.off-row td{ background:var(--off-bg) !important; color:var(--off); font-style:italic; }
  tr.off-row .off-note{ text-align:center; font-weight:700; }

  .badge.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .badge.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }

  .stats-table thead th{ background:#efeadf; }
  .stats-table td.name-cell{ text-align:left; font-weight:700; }
  .stats-table td.unbalanced{ background:#fbe6e2; color:var(--danger); font-weight:700; }

  select, input[type=text], input[type=date], input[type=password]{
    font-family:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1.5px solid var(--line);

  .place-cols{ display:flex; gap:16px; flex-wrap:wrap; }
  .place-col{ flex:1; min-width:260px; }
  .place-col h3{ margin:0 0 8px; font-size:13.5px; }
  .place-col .duty-list{ border:1.5px solid var(--line); border-radius:8px; overflow:hidden; }

  .date-card{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;

  .slot{ display:flex; align-items:center; gap:6px; }
  .swap-note{

  .legend .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }

  .month-nav select{ font-size:14px; font-weight:700; padding:7px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-wk{ text-align:center; font-size:11.5px; font-weight:700; color:#8a8373; padding-bottom:2px; }
  .cal-cell{ position:relative; border:1px solid var(--line); border-radius:8px; min-height:96px; padding:5px 6px 26px; font-size:11px; background:#fff; }
  .cal-actions{

  .cal-action-btn{

  .cal-cell .dnum{ font-weight:700; margin-bottom:4px; font-size:12px; }

  .cal-cell.nodate{ background:#f7f5f0; }
  .cal-cell.nodate .dnum{ color:#c4bfb2; }
  .cal-cell.off{ background:var(--off-bg); }

  .modal-backdrop{

  .modal-header h3{ margin:0; font-size:16px; }
  .modal-slot{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .modal-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .sync-status{ display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:4px 9px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid var(--line); background:#faf9f5; color:#6b6455; }

  .sync-status.offline{ color:var(--danger); border-color:#e6c2c0; background:#fff1f0; }

    main{ padding:14px; } header{ padding:16px; }
    .date-card{ flex-direction:column; align-items:flex-start; }
    .cal-cell{ min-height:64px; font-size:9.5px; padding-bottom:24px; }

</head>

<header>
  <h1>📋 자습감독표 관리</h1>
  <div class="sub">담임·부담임 자습감독 배정 · 베리타스홀 / 교사동 · 월~목요일 운영 · 6/30~12/30</div>

const EXCLUDE_REASONS = {

};

function pad2(n){ return String(n).padStart(2,'0'); }
function makeId(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

function generateFutureDates(startY,startM,startD,endY,endM,endD){
  const list = [];
  let cur = new Date(startY, startM-1, startD);
  const end = new Date(endY, endM-1, endD);
  while(cur <= end){
    const dow = cur.getDay();
    if(dow>=1 && dow<=4){ // 월(1)~목(4)만 감독
      const y=cur.getFullYear(), m=cur.getMonth()+1, d=cur.getDate();
      const id = makeId(y,m,d);
      const label = `${m}월 ${d}일 ${WK[dow]}요일`;
      if(EXCLUDE_REASONS[id]) list.push({id, label, type:'off', note:EXCLUDE_REASONS[id]});
      else list.push({id, label, type:'duty'});
    }
    cur.setDate(cur.getDate()+1);
  }
  return list;
}

const LOCATIONS = ['교사동', '베리타스']; // 항상 교사동이 먼저(위) 표시되도록 순서 고정

function defaultState(){
  const dates = HISTORY_DATES.map(d=>({...d})).concat(generateFutureDates(2026,9,4,2026,12,30));
  const assignments = {};
  Object.entries(HISTORY_ASSIGNMENTS).forEach(([dateId, m])=>{
    Object.entries(m).forEach(([teacherId, loc])=>{ assignments[dateId+'__'+teacherId] = loc; });
  });
  return { teachers: SEED_TEACHERS.map(t=>({...t})), dates, assignments, settings: { password: '5689' } };
}

      const parsed = JSON.parse(raw);
      if(parsed.teachers && parsed.dates){
        if(!parsed.settings || !parsed.settings.password) parsed.settings = { password: '5689' };
        return {state: parsed, isFresh:false};
      }
    }
  }catch(e){}
  return {state: defaultState(), isFresh:true};
}

let selectedMonth = null; // 'YYYY-MM'
let undoStack = [];
const UNDO_LIMIT = 30;

function pushUndo(){
  try{
    undoStack.push(JSON.stringify(state));
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  }catch(e){}
}
function undo(){
  if(!undoStack.length){ alert('되돌릴 변경 내역이 없습니다.'); return; }
  state = JSON.parse(undoStack.pop());
  swapSelection = null; calSelection = null;
  saveState(); render();
}

function saveLocalBackup(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function normalizeRemoteState(raw){
  if(!raw || !Array.isArray(raw.teachers) || !Array.isArray(raw.dates)) return null;
  if(!raw.assignments || typeof raw.assignments !== 'object') raw.assignments = {};
  if(!raw.settings || !raw.settings.password) raw.settings = { password:'5689' };
  return raw;
}

function updateSyncStatus(kind, message){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.className = 'sync-status ' + kind;
  el.textContent = message;
}

function saveState(){
  // 인터넷이 잠시 끊겨도 현재 브라우저에는 백업을 남긴다.
  saveLocalBackup();

  // Firebase의 최초 상태를 확인하기 전에는 원격 데이터를 덮어쓰지 않는다.
  if(!firebaseInitialLoaded) return;

  const payload = JSON.parse(JSON.stringify(state));
  set(REMOTE_STATE_REF, payload)
    .then(()=>{
      if(firebaseConnected) updateSyncStatus('online', '● 실시간 공유 중');
    })
    .catch(err=>{
      console.error('Firebase 저장 실패:', err);
      updateSyncStatus('offline', '● 저장 실패 · 로컬 백업됨');
    });
}

function initRealtimeSync(){
  updateSyncStatus('connecting', '● Firebase 연결 중...');

  onValue(CONNECTED_REF, snap=>{
    firebaseConnected = snap.val() === true;
    if(firebaseConnected){
      updateSyncStatus('online', firebaseInitialLoaded ? '● 실시간 공유 중' : '● 서버 연결됨 · 데이터 확인 중');
    } else {
      updateSyncStatus('offline', '● 오프라인 · 로컬 백업 중');
    }
  });

  onValue(REMOTE_STATE_REF, async snap=>{
    // 첫 연결: 서버에 데이터가 있으면 그것을 기준으로 사용하고,
    // 비어 있으면 현재 파일/브라우저의 감독표를 최초 공용 데이터로 올린다.
    if(!firebaseInitialLoaded){
      firebaseInitialLoaded = true;

      if(snap.exists()){
        const incoming = normalizeRemoteState(snap.val());
        if(incoming){
          state = incoming;
          isFresh = false;
          undoStack = [];
          swapSelection = null;
          calSelection = null;
          saveLocalBackup();
          render();
        }
      } else {
        updateSyncStatus('connecting', '● 최초 감독표를 서버에 등록 중...');
        try{
          await set(REMOTE_STATE_REF, JSON.parse(JSON.stringify(state)));
          saveLocalBackup();
        }catch(err){
          console.error('Firebase 최초 저장 실패:', err);
          updateSyncStatus('offline', '● 최초 저장 실패 · 로컬 백업 중');
        }
      }

      if(firebaseConnected) updateSyncStatus('online', '● 실시간 공유 중');
      return;
    }

    // 이후에는 다른 기기에서 변경된 내용을 즉시 화면에 반영한다.
    if(snap.exists()){
      const incoming = normalizeRemoteState(snap.val());
      if(!incoming) return;

      const incomingJson = JSON.stringify(incoming);
      const currentJson = JSON.stringify(state);
      if(incomingJson !== currentJson){
        state = incoming;
        undoStack = []; // 다른 사용자의 변경 이후에는 이전 로컬 undo 기록을 섞지 않는다.
        swapSelection = null;
        calSelection = null;
        saveLocalBackup();
        render();
      }
    }
  }, err=>{
    console.error('Firebase 읽기 실패:', err);
    updateSyncStatus('offline', '● 서버 읽기 실패 · 규칙을 확인하세요');
  });
}

function key(dateId, teacherId){ return dateId + '__' + teacherId; }
function dutyDates(){ return state.dates.filter(d=>d.type==='duty'); }
function getAssign(dateId, teacherId){ return state.assignments[key(dateId,teacherId)] || null; }
function setAssign(dateId, teacherId, loc){
  const k = key(dateId,teacherId);
  if(loc) state.assignments[k] = loc; else delete state.assignments[k];
}
function availableMonths(){ return [...new Set(state.dates.map(d=>d.id.slice(0,7)))].sort(); }
function todayYM(){
  const t = new Date();
  return `${t.getFullYear()}-${pad2(t.getMonth()+1)}`;
}
function ensureSelectedMonth(){
  const months = availableMonths();
  if(!months.length) return;
  if(selectedMonth && months.includes(selectedMonth)) return;
  const ym = todayYM();
  if(months.includes(ym)){ selectedMonth = ym; return; }
  const next = months.find(m=> m >= ym);
  selectedMonth = next || months[months.length-1];
}

/* ===================== 통계 ===================== */
function computeCounts(){
  const counts = {};
  state.teachers.forEach(t=> counts[t.id] = {베리타스:0, 교사동:0, total:0});
  Object.entries(state.assignments).forEach(([k, loc])=>{
    const teacherId = k.split('__')[1];
    if(counts[teacherId]){ counts[teacherId][loc]++; counts[teacherId].total++; }
  });
  return counts;
}

/* ===================== 자동/재배정 ===================== */
function runAssignment(mode, cutoffId, opts={}){
  if(!opts.silent){
    const msg = mode==='full'
      ? '6/30~9/3 고정 배정을 제외한 나머지 전체 일정을 다시 배정할까요?'
      : mode==='from'
        ? '선택한 날짜부터(그 날짜 포함) 이후 일정을 다시 배정합니다. 그 이전 배정은 유지됩니다. 계속할까요?'
        : '선택한 날짜 이후의 일정만 다시 배정합니다. (그 날짜까지의 배정은 유지됩니다) 계속할까요?';
    if(!confirm(msg)) return;
    pushUndo();
  }
  state.dates.forEach(d=>{
    if(d.type!=='duty' || d.locked) return;
    const inRange = mode==='full'
      || (mode==='after' && d.id > cutoffId)
      || (mode==='from' && d.id >= cutoffId);
    if(inRange){
      state.teachers.forEach(t=> setAssign(d.id, t.id, null));
    }
  });

  const homeroom = state.teachers.filter(t=>t.role==='담임');
  const vice = state.teachers.filter(t=>t.role==='부담임');
  function oppositeOf(loc){ return loc==='베리타스' ? '교사동' : '베리타스'; }
  function preferredLoc(counts, id){ return counts[id].베리타스 <= counts[id].교사동 ? '베리타스' : '교사동'; }

  // 주(월~목) 단위 키: 같은 주에 두 번 감독하지 않도록, 그리고 마지막 감독일과의 간격(텀)을 최대한 넓히기 위해 사용
  function weekKeyOf(dateId){
    const dt = new Date(dateId+'T00:00:00');
    const dow = dt.getDay();
    const monday = new Date(dt);
    monday.setDate(dt.getDate() - (dow===0 ? 6 : dow-1));
    return makeId(monday.getFullYear(), monday.getMonth()+1, monday.getDate());
  }
  function daysBetween(idA, idB){
    const a = new Date(idA+'T00:00:00'), b = new Date(idB+'T00:00:00');
    return Math.round((b-a)/86400000);
  }

  // 이미 고정/유지되는 배정(잠긴 구간 + 이번 재배정에서 지우지 않은 부분)을 시간순으로 훑어
  // 각 선생님의 "마지막 감독일"과 "마지막 감독 주"를 미리 계산해둔다.
  const lastDate = {}, lastWeek = {};
  state.teachers.forEach(t=>{ lastDate[t.id]=null; lastWeek[t.id]=null; });
  const fixedEntries = [];
  state.dates.forEach(dd=>{
    if(dd.type!=='duty') return;
    state.teachers.forEach(t=>{
      const loc = getAssign(dd.id, t.id);
      if(loc) fixedEntries.push({dateId:dd.id, teacherId:t.id});
    });
  });
  fixedEntries.sort((a,b)=> a.dateId.localeCompare(b.dateId));
  fixedEntries.forEach(({dateId, teacherId})=>{
    lastDate[teacherId] = dateId;
    lastWeek[teacherId] = weekKeyOf(dateId);
  });

  // 후보를 "총 횟수가 적은 사람 우선 → 그중 마지막 감독일로부터 간격(텀)이 긴 사람 우선"으로 정렬.
  // 같은 주에 이미 감독한 사람은 원칙적으로 제외(불가피할 때만 허용).
  function sortedCandidates(counts, pool, dateId, wk){
    const noSameWeek = pool.filter(t=> lastWeek[t.id] !== wk);
    const usable = noSameWeek.length >= 1 ? noSameWeek : pool; // 정말 대안이 없을 때만 같은 주 허용
    return [...usable].sort((a,b)=>{
      if(counts[a.id].total !== counts[b.id].total) return counts[a.id].total - counts[b.id].total;
      const gapA = lastDate[a.id] ? daysBetween(lastDate[a.id], dateId) : 9999;
      const gapB = lastDate[b.id] ? daysBetween(lastDate[b.id], dateId) : 9999;
      if(gapA !== gapB) return gapB - gapA; // 간격이 긴 사람이 먼저
      return a.id.localeCompare(b.id);
    });
  }

  dutyDates().forEach(d=>{
    const already = state.teachers.some(t=> getAssign(d.id,t.id));
    if(already) return;
    const counts = computeCounts();
    const wk = weekKeyOf(d.id);

    // 원칙: 담임 1명 + 부담임 1명
    const hSorted = sortedCandidates(counts, homeroom.length ? homeroom : state.teachers, d.id, wk);
    const Hp = hSorted[0];
    const vSorted = sortedCandidates(counts, (vice.length ? vice : state.teachers).filter(t=> !Hp || t.id!==Hp.id), d.id, wk);
    const Vp = vSorted[0];

    // 예외: 역할 구분 없이 전체에서 뽑았을 때가 횟수 균형에 뚜렷이 더 유리하면 원칙을 무시
    const fullSorted = sortedCandidates(counts, state.teachers, d.id, wk);
    const Hr = fullSorted[0];
    const Vr = fullSorted.find(t=> !Hr || t.id!==Hr.id);

    let H, V;
    if(Hp && Vp){
      const pairedCost = counts[Hp.id].total + counts[Vp.id].total;
      const relaxedCost = (Hr && Vr) ? counts[Hr.id].total + counts[Vr.id].total : Infinity;
      if(relaxedCost < pairedCost - 1){
        H = Hr; V = Vr; // 균형이 뚜렷이 더 나은 쪽 채택 (원칙보다 형평성 우선)
      } else {
        H = Hp; V = Vp; // 원칙(담임+부담임) 유지
      }
    } else if(Hr && Vr){
      H = Hr; V = Vr;
    }
    if(!H || !V || H.id===V.id) return;

    let locH = preferredLoc(counts, H.id), locV = preferredLoc(counts, V.id);
    if(locH === locV){
      const diffH = Math.abs(counts[H.id].베리타스 - counts[H.id].교사동);
      const diffV = Math.abs(counts[V.id].베리타스 - counts[V.id].교사동);
      if(diffH >= diffV) locV = oppositeOf(locH); else locH = oppositeOf(locV);
    }
    setAssign(d.id, H.id, locH);
    setAssign(d.id, V.id, locV);
    lastDate[H.id] = d.id; lastWeek[H.id] = wk;
    lastDate[V.id] = d.id; lastWeek[V.id] = wk;
  });

  if(!opts.silent){ saveState(); render(); }
}

/* ===================== 셀 클릭 (일반 편집 / 맞교환) ===================== */
// 두 (날짜,선생님) 슬롯의 "장소는 그대로 두고" 담당 선생님만 서로 바꿔치기한다.
function swapTeachers(dateA, teacherA, dateB, teacherB){
  pushUndo();
  const locA = getAssign(dateA, teacherA);
  const locB = getAssign(dateB, teacherB);
  setAssign(dateA, teacherA, null);
  setAssign(dateB, teacherB, null);
  setAssign(dateA, teacherB, locA);
  setAssign(dateB, teacherA, locB);
  saveState();
}
function cycleAssign(dateId, teacherId){
  pushUndo();
  const cur = getAssign(dateId, teacherId);
  const next = cur === null ? '교사동' : (cur === '교사동' ? '베리타스' : null);
  setAssign(dateId, teacherId, next);
  saveState(); render();
}
function handleCellClick(dateId, teacherId){
  if(!swapMode){ cycleAssign(dateId, teacherId); return; }
  if(!swapSelection){ swapSelection = {dateId, teacherId}; render(); return; }
  if(swapSelection.dateId===dateId && swapSelection.teacherId===teacherId){ swapSelection = null; render(); return; }
  swapTeachers(swapSelection.dateId, swapSelection.teacherId, dateId, teacherId);
  swapSelection = null;
  render();
}
// 달력보기 전용: 이름을 클릭 → 다른 날짜의 이름을 클릭하면 바로 자리를 맞바꿈 (모드 전환 불필요)
// 장소(베리타스/교사동)는 각 날짜에 그대로 고정되고, 담당 선생님만 서로 바뀐다.
function handleCalendarChipClick(dateId, teacherId, ev){
  if(ev) ev.stopPropagation();
  if(!calSelection){ calSelection = {dateId, teacherId}; render(); return; }
  if(calSelection.dateId===dateId && calSelection.teacherId===teacherId){ calSelection = null; render(); return; }
  swapTeachers(calSelection.dateId, calSelection.teacherId, dateId, teacherId);
  calSelection = null;
  render();
}

    panel.appendChild(el(`<div class="swap-note">🔁 <strong>${dLabel} · ${tName}</strong> 선택됨 → 바꿀 상대 이름을 클릭하세요. <button class="btn small" id="calSelCancel" style="margin-left:8px;">취소</button></div>`));
  } else {
    panel.appendChild(el(`<p class="hint">💡 이름을 클릭한 뒤 다른 날짜의 이름을 클릭하면 두 배정이 바로 자리를 맞바꿉니다.</p>`));
  }

  const nav = document.createElement('div');

  const prevBtn = el(`<button class="btn icon">◀</button>`);
  const nextBtn = el(`<button class="btn icon">▶</button>`);
  const sel = document.createElement('select');
  months.forEach(ym=>{
    const [y,m] = ym.split('-').map(Number);
    const opt = document.createElement('option');
    opt.value = ym; opt.textContent = `${y}년 ${m}월`;
    opt.selected = (ym===selectedMonth);
    sel.appendChild(opt);
  });
  const todayBtn = el(`<button class="btn small">오늘</button>`);
  nav.appendChild(prevBtn); nav.appendChild(sel); nav.appendChild(nextBtn); nav.appendChild(todayBtn);
  panel.appendChild(nav);

  const gridBox = document.createElement('div');
  panel.appendChild(gridBox);
  main.appendChild(panel);

  const cancelBtn = document.getElementById('calSelCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ calSelection = null; render(); });

  function draw(){
    gridBox.innerHTML = '';
    const [y,m] = selectedMonth.split('-').map(Number);
    gridBox.appendChild(renderMonthGrid(y,m));
  }
  draw();

  sel.addEventListener('change', e=>{ selectedMonth = e.target.value; draw(); });
  prevBtn.addEventListener('click', ()=>{
    const idx = months.indexOf(selectedMonth);
    if(idx>0){ selectedMonth = months[idx-1]; sel.value = selectedMonth; draw(); }
  });
  nextBtn.addEventListener('click', ()=>{
    const idx = months.indexOf(selectedMonth);
    if(idx<months.length-1){ selectedMonth = months[idx+1]; sel.value = selectedMonth; draw(); }
  });
  todayBtn.addEventListener('click', ()=>{
    const ym = todayYM();
    selectedMonth = months.includes(ym) ? ym : (months.find(x=>x>=ym) || months[months.length-1]);
    sel.value = selectedMonth; draw();
  });
}

function renderMonthGrid(y,m){
  const box = document.createElement('div');
  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  WK.forEach(w=> grid.appendChild(el(`<div class="cal-wk">${w}</div>`)));

  const first = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startDow = first.getDay();
  for(let i=0;i<startDow;i++) grid.appendChild(el(`<div class="cal-cell blank"></div>`));

  for(let d=1; d<=daysInMonth; d++){
    const id = makeId(y,m,d);
    const dateEntry = state.dates.find(x=>x.id===id);
    const cell = document.createElement('div');
    if(!dateEntry){
      cell.className = 'cal-cell nodate';
      cell.innerHTML = `<div class="dnum">${d}</div>`;
    } else if(dateEntry.type==='off'){
      cell.className = 'cal-cell off';
      cell.style.cursor = 'pointer';
      cell.innerHTML = `<div class="dnum">${d}</div>${dateEntry.note ? `<div class="cal-note">${dateEntry.note}</div>` : ''}`;
      cell.addEventListener('click', ()=> openDayModal(id));
    } else {
      cell.className = 'cal-cell duty';
      const dnum = document.createElement('div');
      dnum.className = 'dnum';
      dnum.textContent = d + (dateEntry.locked ? ' 🔒' : '');
      cell.appendChild(dnum);
      state.teachers
        .map(t=>({t, loc: getAssign(id, t.id)}))
        .filter(p=>p.loc)
        .sort((a,b)=> (a.loc==='교사동'?0:1) - (b.loc==='교사동'?0:1))
        .forEach(({t, loc})=>{
          const chip = document.createElement('div');
          chip.className = 'cal-chip';
          const isSelected = calSelection && calSelection.dateId===id && calSelection.teacherId===t.id;
          if(isSelected) chip.classList.add('cal-chip-selected');
          chip.innerHTML = `<span class="cal-circle ${loc}">${loc[0]}</span><span class="cal-chip-name">${t.name}</span>`;
          chip.addEventListener('click', (ev)=> handleCalendarChipClick(id, t.id, ev));
          cell.appendChild(chip);
        });
      if(!dateEntry.locked){
        const actions = document.createElement('div');
        actions.className = 'cal-actions';
        const regenBtn = document.createElement('button');
        regenBtn.className = 'cal-action-btn';
        regenBtn.title = '이 날짜부터(포함) 재배정';
        regenBtn.textContent = '🔁';
        regenBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); runAssignment('from', id); });
        const holidayBtn = document.createElement('button');
        holidayBtn.className = 'cal-action-btn';
        holidayBtn.title = '감독없는 날로 지정';
        holidayBtn.textContent = '🚫';
        holidayBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); designateHoliday(id); });
        actions.appendChild(regenBtn);
        actions.appendChild(holidayBtn);
        cell.appendChild(actions);
      }
      cell.addEventListener('click', ()=> openDayModal(id));
    }
    grid.appendChild(cell);
  }
  box.appendChild(grid);
  return box;
}

}

    });
    if(!ul.children.length) ul.appendChild(el(`<li style="color:#9a9488;">배정된 감독 일정이 없습니다.</li>`));
    listBox.appendChild(ul);
  }
  sel.addEventListener('change', draw);
  draw();
}

/* ---------- 장소별 ---------- */
function renderByPlace(main){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2>장소별 조회</h2>`;

  const selWrap = document.createElement('div');
  selWrap.style.marginBottom = '14px';
  const sel = document.createElement('select');
  ['전체', ...LOCATIONS].forEach(opt=>{
    const o = document.createElement('option');
    o.value = opt; o.textContent = opt==='전체' ? '전체 보기' : opt;
    sel.appendChild(o);
  });
  selWrap.appendChild(sel);
  panel.appendChild(selWrap);

  const body = document.createElement('div');
  panel.appendChild(body);
  main.appendChild(panel);

  function buildList(loc){
    const ul = document.createElement('ul');
    ul.className = 'duty-list';
    dutyDates().forEach(d=>{
      state.teachers.forEach(t=>{
        if(getAssign(d.id,t.id)===loc){
          const li = document.createElement('li');
          li.innerHTML = `<span>${d.label}</span><span><span class="badge role-${t.role}">${t.role}</span> <strong>${t.name}</strong></span>`;
          ul.appendChild(li);
        }
      });
    });
    if(!ul.children.length) ul.appendChild(el(`<li style="color:#9a9488;">배정 없음</li>`));
    return ul;
  }

  function draw(){
    body.innerHTML = '';
    const choice = sel.value;
    if(choice==='전체'){
      const cols = document.createElement('div');
      cols.className = 'place-cols';
      LOCATIONS.forEach(loc=>{
        const col = document.createElement('div');
        col.className = 'place-col';
        col.innerHTML = `<h3><span class="badge ${loc}">${loc}</span></h3>`;
        col.appendChild(buildList(loc));
        cols.appendChild(col);
      });
      body.appendChild(cols);
    } else {
      const col = document.createElement('div');
      col.className = 'place-col';
      col.innerHTML = `<h3><span class="badge ${choice}">${choice}</span></h3>`;
      col.appendChild(buildList(choice));
      body.appendChild(col);
    }
  }
  sel.addEventListener('change', draw);
  draw();
}

/* ---------- 통계 (별도 탭) ---------- */
function renderStats(main){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2>감독 횟수 현황</h2><p class="hint">베리타스·교사동·총 감독 횟수가 선생님마다 고르게 유지되는지 한눈에 확인합니다. 최댓값·최솟값 차이가 2회 이상이면 붉게 표시됩니다.</p>`;
  const counts = computeCounts();
  const totals = state.teachers.map(t=>counts[t.id].total);
  const maxTotal = Math.max(0,...totals), minTotal = Math.min(...(totals.length?totals:[0]));
  const table = document.createElement('table');
  table.className = 'stats-table';
  table.innerHTML = `<thead><tr><th>이름</th><th>역할</th><th>베리타스</th><th>교사동</th><th>총</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  state.teachers.forEach(t=>{
    const c = counts[t.id];
    const unbalanced = (maxTotal - minTotal) >= 2 && (c.total===maxTotal || c.total===minTotal);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="name-cell">${t.name}</td><td><span class="badge role-${t.role}">${t.role}</span></td>
      <td>${c.베리타스}</td><td>${c.교사동}</td><td class="${unbalanced?'unbalanced':''}">${c.total}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(table);

  const dutyCount = dutyDates().length;
  const doneCount = dutyDates().filter(d=> state.teachers.some(t=>getAssign(d.id,t.id))).length;
  panel.appendChild(el(`<p class="hint" style="margin-top:12px;">전체 감독일 ${dutyCount}일 중 ${doneCount}일 배정 완료</p>`));

  main.appendChild(panel);
}

/* ---------- 설정 ---------- */
function renderSettings(main){
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2>선생님 관리</h2><p class="hint">이름·역할 수정, 추가, 삭제가 가능합니다.</p>`;
  const table = document.createElement('table');
  table.className = 'grid';
  table.innerHTML = `<thead><tr><th>이름</th><th>역할</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  state.teachers.forEach(t=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="t-name" value="${t.name}" data-id="${t.id}"></td>
      <td>
        <select class="t-role" data-id="${t.id}">
          <option value="담임" ${t.role==='담임'?'selected':''}>담임</option>
          <option value="부담임" ${t.role==='부담임'?'selected':''}>부담임</option>
        </select>
      </td>
      <td><button class="btn danger small t-del" data-id="${t.id}">삭제</button></td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(table);

  panel.appendChild(el(`<div class="addbar">
      <input type="text" id="newTeacherName" placeholder="새 선생님 이름">
      <select id="newTeacherRole"><option value="담임">담임</option><option value="부담임">부담임</option></select>
      <button class="btn primary small" id="addTeacherBtn">추가</button>
    </div>`));
  main.appendChild(panel);

  panel.querySelectorAll('.t-name').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const t = state.teachers.find(t=>t.id===e.target.dataset.id);
      if(t){ pushUndo(); t.name = e.target.value.trim() || t.name; saveState(); render(); }
    });
  });
  panel.querySelectorAll('.t-role').forEach(s=>{
    s.addEventListener('change', e=>{
      const t = state.teachers.find(t=>t.id===e.target.dataset.id);
      if(t){ pushUndo(); t.role = e.target.value; saveState(); render(); }
    });
  });
  panel.querySelectorAll('.t-del').forEach(b=>{
    b.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const t = state.teachers.find(t=>t.id===id);
      if(!confirm(`${t.name} 선생님을 삭제할까요? 배정된 기록도 함께 삭제됩니다.`)) return;
      pushUndo();
      state.teachers = state.teachers.filter(t=>t.id!==id);
      Object.keys(state.assignments).forEach(k=>{ if(k.endsWith('__'+id)) delete state.assignments[k]; });
      saveState(); render();
    });
  });
  document.getElementById('addTeacherBtn').addEventListener('click', ()=>{
    const nameInp = document.getElementById('newTeacherName');
    const roleSel = document.getElementById('newTeacherRole');
    const name = nameInp.value.trim();
    if(!name){ alert('이름을 입력하세요.'); return; }
    pushUndo();
    state.teachers.push({id:'t'+Date.now(), name, role: roleSel.value});
    saveState(); render();
  });

  /* 비밀번호 변경 */
  const ppanel = document.createElement('div');
  ppanel.className = 'panel';
  ppanel.innerHTML = `<h2>비밀번호 변경</h2><p class="hint">"전체 자동배정"과 "초기화" 실행 시 필요한 비밀번호를 바꿉니다.</p>`;
  ppanel.appendChild(el(`<div class="addbar">
      <input type="password" id="curPw" placeholder="현재 비밀번호">
      <input type="password" id="newPw" placeholder="새 비밀번호">
      <input type="password" id="newPw2" placeholder="새 비밀번호 확인">
      <button class="btn primary small" id="changePwBtn">변경</button>
    </div>`));
  main.appendChild(ppanel);

  document.getElementById('changePwBtn').addEventListener('click', ()=>{
    const curInp = document.getElementById('curPw');
    const n1Inp = document.getElementById('newPw');
    const n2Inp = document.getElementById('newPw2');
    if(curInp.value !== state.settings.password){ alert('현재 비밀번호가 올바르지 않습니다.'); return; }
    if(!n1Inp.value){ alert('새 비밀번호를 입력하세요.'); return; }
    if(n1Inp.value !== n2Inp.value){ alert('새 비밀번호 확인이 일치하지 않습니다.'); return; }
    state.settings.password = n1Inp.value;
    saveState();
    alert('비밀번호가 변경되었습니다.');
    curInp.value=''; n1Inp.value=''; n2Inp.value='';
  });

  /* 휴일 빠르게 추가 */
  const hpanel = document.createElement('div');
  hpanel.className = 'panel';
  hpanel.innerHTML = `<h2>휴일 추가</h2><p class="hint">새로운 휴일(시험, 행사, 재량휴업일 등)을 넣으면 해당 날짜는 감독 없음으로 바뀌고, 원한다면 그 날짜 이후 일정을 자동으로 다시 배정할 수 있습니다.</p>`;
  hpanel.appendChild(el(`<div class="addbar">
      <input type="date" id="holidayDate">
      <input type="text" id="holidayReason" placeholder="사유 (예: 중간고사)">
      <button class="btn primary small" id="addHolidayBtn">휴일로 지정</button>
    </div>`));
  main.appendChild(hpanel);

  document.getElementById('addHolidayBtn').addEventListener('click', ()=>{
    const dateInp = document.getElementById('holidayDate');
    const reasonInp = document.getElementById('holidayReason');
    const id = dateInp.value;
    const reason = reasonInp.value.trim() || '휴무';
    if(!id){ alert('날짜를 선택하세요.'); return; }
    const dow = new Date(id+'T00:00:00').getDay();
    let entry = state.dates.find(d=>d.id===id);
    if(entry && entry.locked){ alert('9/3까지의 고정 배정 구간은 여기서 휴일로 바꿀 수 없습니다. 설정 하단 날짜 관리에서 직접 수정하세요.'); return; }
    pushUndo();
    if(entry){
      entry.type = 'off'; entry.note = reason;
      state.teachers.forEach(t=> setAssign(id, t.id, null));
    } else {
      const [y,m,d] = id.split('-').map(Number);
      state.dates.push({id, label:`${m}월 ${d}일 ${WK[dow]}요일`, type:'off', note:reason});
    }
    state.dates.sort((a,b)=> a.id.localeCompare(b.id));
    saveState();
    if(confirm('이 날짜 이후 일정을 다시 배정할까요? (지금까지의 배정은 유지됩니다)')){
      runAssignment('after', id);
    } else {
      render();
    }
    dateInp.value=''; reasonInp.value='';
  });

  /* 지정 날짜부터 재배정 */
  const rpanel = document.createElement('div');
  rpanel.className = 'panel';
  rpanel.innerHTML = `<h2>지정 날짜부터 재배정</h2><p class="hint">날짜를 하나 고르면 그 날짜부터(해당 날짜 포함) 이후 감독일 전체를 다시 배정합니다. 그 이전 배정과 6/30~9/3 고정 구간은 그대로 유지됩니다.</p>`;
  rpanel.appendChild(el(`<div class="addbar">
      <input type="date" id="fromDate">
      <button class="btn primary small" id="fromDateBtn">이 날짜부터 재배정</button>
    </div>`));
  main.appendChild(rpanel);

  document.getElementById('fromDateBtn').addEventListener('click', ()=>{
    const fromInp = document.getElementById('fromDate');
    const id = fromInp.value;
    if(!id){ alert('날짜를 선택하세요.'); return; }
    const entry = state.dates.find(d=>d.id===id);
    if(entry && entry.locked){ alert('9/3까지의 고정 배정 구간은 여기서부터 재배정할 수 없습니다.'); return; }
    runAssignment('from', id);
  });

  /* 날짜 관리 */
  const dpanel = document.createElement('div');
  dpanel.className = 'panel';
  dpanel.innerHTML = `<h2>날짜 관리</h2><p class="hint">각 날짜의 유형을 직접 바꾸거나 삭제할 수 있습니다. 🔒는 9/3까지 고정된 감독일입니다.</p>`;
  const dtable = document.createElement('table');
  dtable.className = 'grid';
  dtable.innerHTML = `<thead><tr><th>표시 라벨</th><th>유형</th><th>메모</th><th></th></tr></thead>`;
  const dtbody = document.createElement('tbody');
  state.dates.forEach(d=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="d-label" value="${d.label}" data-id="${d.id}">${d.locked?' 🔒':''}</td>
      <td>
        <select class="d-type" data-id="${d.id}" ${d.locked?'disabled':''}>
          <option value="duty" ${d.type==='duty'?'selected':''}>감독일</option>
          <option value="off" ${d.type==='off'?'selected':''}>휴무</option>
        </select>
      </td>
      <td><input type="text" class="d-note" value="${d.note||''}" placeholder="예: 축제" data-id="${d.id}"></td>
      <td>
        ${!d.locked ? `<button class="btn small d-regen" data-id="${d.id}" title="이 날짜 이후 재배정">⏩</button>
        <button class="btn small d-regen-from" data-id="${d.id}" title="이 날짜부터(포함) 재배정">🔁</button>` : ''}
        <button class="btn danger small d-del" data-id="${d.id}">삭제</button>
      </td>`;
    dtbody.appendChild(tr);
  });
  dtable.appendChild(dtbody);
  dpanel.appendChild(dtable);
  dpanel.appendChild(el(`<div class="addbar">
      <input type="date" id="newDateId2">
      <input type="text" id="newDateReason" placeholder="감독일이면 비워두세요">
      <button class="btn primary small" id="addDateBtn2">추가</button>
    </div>`));
  main.appendChild(dpanel);

  dpanel.querySelectorAll('.d-label').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const d = state.dates.find(d=>d.id===e.target.dataset.id);
      if(d){ pushUndo(); d.label = e.target.value.trim() || d.label; saveState(); render(); }
    });
  });
  dpanel.querySelectorAll('.d-type').forEach(s=>{
    s.addEventListener('change', e=>{
      const d = state.dates.find(d=>d.id===e.target.dataset.id);
      if(!d) return;
      pushUndo();
      d.type = e.target.value;
      if(d.type==='off') state.teachers.forEach(t=> setAssign(d.id, t.id, null));
      saveState();
      if(confirm('이 날짜 이후 일정을 다시 배정할까요? (지금까지의 배정은 유지됩니다)')) runAssignment('after', d.id);
      else render();
    });
  });
  dpanel.querySelectorAll('.d-note').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const d = state.dates.find(d=>d.id===e.target.dataset.id);
      if(d){ pushUndo(); d.note = e.target.value; saveState(); render(); }
    });
  });
  dpanel.querySelectorAll('.d-regen').forEach(b=>{
    b.addEventListener('click', e=> runAssignment('after', e.target.dataset.id));
  });
  dpanel.querySelectorAll('.d-regen-from').forEach(b=>{
    b.addEventListener('click', e=> runAssignment('from', e.target.dataset.id));
  });
  dpanel.querySelectorAll('.d-del').forEach(b=>{
    b.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const d = state.dates.find(d=>d.id===id);
      if(d && d.locked && !confirm('고정된(🔒) 날짜입니다. 정말 삭제할까요?')) return;
      if(!d.locked && !confirm('이 날짜를 삭제할까요? 배정된 기록도 함께 삭제됩니다.')) return;
      pushUndo();
      state.dates = state.dates.filter(d=>d.id!==id);
      Object.keys(state.assignments).forEach(k=>{ if(k.startsWith(id+'__')) delete state.assignments[k]; });
      saveState(); render();
    });
  });
  document.getElementById('addDateBtn2').addEventListener('click', ()=>{
    const idInp = document.getElementById('newDateId2');
    const reasonInp = document.getElementById('newDateReason');
    const id = idInp.value;
    if(!id){ alert('날짜를 선택하세요.'); return; }
    if(state.dates.some(d=>d.id===id)){ alert('이미 존재하는 날짜입니다.'); return; }
    pushUndo();
    const dow = new Date(id+'T00:00:00').getDay();
    const [y,m,d] = id.split('-').map(Number);
    const reason = reasonInp.value.trim();
    state.dates.push({id, label:`${m}월 ${d}일 ${WK[dow]}요일`, type: reason ? 'off' : 'duty', note: reason});
    state.dates.sort((a,b)=> a.id.localeCompare(b.id));
    saveState(); render();
  });
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ currentView = b.dataset.view; swapSelection=null; calSelection=null; render(); });
});
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('swapModeBtn').addEventListener('click', ()=>{ swapMode = !swapMode; swapSelection = null; render(); });
document.getElementById('autoGenBtn').addEventListener('click', ()=>{
  checkPasswordThen('전체 자동배정', ()=> runAssignment('full', null));
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  checkPasswordThen('초기화', ()=>{
    if(!confirm('모든 데이터를 초기 상태로 되돌릴까요? (6/30~9/3 고정 배정 + 9/4~12/30 자동 배정으로 다시 시작합니다)')) return;
    pushUndo();
    const keepPassword = state.settings.password;
    state = defaultState();
    state.settings.password = keepPassword;
    runAssignment('full', null, {silent:true});
    saveState(); render();
  });
});

initRealtimeSync();
