<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자습감독표 관리</title>
<style>
  :root{
    --ink:#1c2430;
    --paper:#f5f3ee;
    --panel:#ffffff;
    --line:#dfd9cc;
    --veritas:#1d5fd6;
    --veritas-bg:#dde8fb;
    --gyosa:#d9560c;
    --gyosa-bg:#fbe6d6;
    --accent:#b5542a;
    --accent-bg:#f6e6dc;
    --off:#9a9488;
    --off-bg:#eeece5;
    --danger:#b0413e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;
  }
  header{
    padding:22px 24px 16px; border-bottom:2px solid var(--ink); background:var(--panel);
    position:sticky; top:0; z-index:20;
  }
  header h1{ margin:0 0 4px; font-size:20px; letter-spacing:-0.02em; }
  header .sub{ color:#6b6455; font-size:12.5px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn{
    padding:7px 14px; border-radius:999px; border:1.5px solid var(--ink); background:transparent;
    font-size:13px; cursor:pointer; color:var(--ink); font-weight:600;
  }
  .tab-btn.active{ background:var(--ink); color:#fff; }
  .spacer{flex:1;}
  .btn{
    padding:7px 13px; border-radius:8px; border:1.5px solid var(--ink); background:var(--panel);
    font-size:12.5px; cursor:pointer; font-weight:600; color:var(--ink);
  }
  .btn:hover{ background:#efece3; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ border-color:var(--danger); color:var(--danger); }
  .btn.small{ padding:4px 9px; font-size:11px; }
  .btn.toggle-on{ background:var(--ink); color:#fff; }
  .btn.icon{ padding:6px 10px; font-size:14px; line-height:1; }
  main{ padding:20px 24px 60px; max-width:1400px; margin:0 auto; }
  .panel{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:18px;
  }
  .panel h2{ margin:0 0 12px; font-size:15px; }
  .hint{ font-size:12px; color:#847d6c; margin:0 0 12px; }

  table.grid{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.grid th, table.grid td{ border:1px solid var(--line); padding:6px 8px; text-align:center; white-space:nowrap; }
  table.grid thead th{ background:#efeadf; position:sticky; top:0; }
  table.grid .date-col{ text-align:left; position:sticky; left:0; background:#efeadf; font-weight:600; min-width:150px; }
  table.grid tbody tr:nth-child(even) td:not(.date-col){ background:#fbfaf6; }
  table.grid .name-input{
    width:100%; border:none; background:transparent; text-align:center; font-weight:700; font-size:12.5px;
    color:var(--ink); border-radius:4px;
  }
  table.grid .name-input:focus{ background:#fff3e6; outline:1px solid var(--accent); }
  .role-tag{ display:block; font-size:10px; font-weight:500; color:#8a8373; }
  .cell{ cursor:pointer; border-radius:6px; padding:5px 4px; font-weight:700; min-width:52px; transition:transform .06s; }
  .cell:hover{ transform:scale(1.04); }
  .cell.empty{ color:#c4bfb2; }
  .cell.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .cell.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }
  .cell.selected{ outline:2.5px solid var(--accent); }
  tr.off-row td{ background:var(--off-bg) !important; color:var(--off); font-style:italic; }
  tr.off-row .off-note{ text-align:center; font-weight:700; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .badge.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }
  .badge.role-담임{ background:var(--accent-bg); color:var(--accent); }
  .badge.role-부담임{ background:#e7e3d8; color:#6b6455; }

  .stats-table{ border-collapse:collapse; width:100%; font-size:12.5px; }
  .stats-table th, .stats-table td{ border:1px solid var(--line); padding:6px 8px; text-align:center; }
  .stats-table thead th{ background:#efeadf; }
  .stats-table td.name-cell{ text-align:left; font-weight:700; }
  .stats-table td.unbalanced{ background:#fbe6e2; color:var(--danger); font-weight:700; }

  select, input[type=text], input[type=date], input[type=password]{
    font-family:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink);
  }

  .duty-list{ list-style:none; padding:0; margin:0; }
  .duty-list li{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  .duty-list li:last-child{ border-bottom:none; }

  .place-cols{ display:flex; gap:16px; flex-wrap:wrap; }
  .place-col{ flex:1; min-width:260px; }
  .place-col h3{ margin:0 0 8px; font-size:13.5px; }
  .place-col .duty-list{ border:1.5px solid var(--line); border-radius:8px; overflow:hidden; }

  .date-card{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .date-card .date-label{ font-weight:700; min-width:150px; }
  .slot{ display:flex; align-items:center; gap:6px; }
  .swap-note{
    background:var(--accent-bg); border:1px solid var(--accent); border-radius:8px; padding:10px 14px;
    font-size:12.5px; margin-bottom:14px; color:var(--accent); font-weight:600;
  }
  .legend{ display:flex; gap:18px; margin-bottom:16px; font-size:12.5px; flex-wrap:wrap; align-items:center; }
  .legend .swatch{ display:inline-flex; align-items:center; gap:6px; font-weight:700; }
  .legend .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .month-nav{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .month-nav select{ font-size:14px; font-weight:700; padding:7px 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-wk{ text-align:center; font-size:11.5px; font-weight:700; color:#8a8373; padding-bottom:2px; }
  .cal-cell{ position:relative; border:1px solid var(--line); border-radius:8px; min-height:96px; padding:5px 6px 26px; font-size:11px; background:#fff; }
  .cal-actions{
    position:absolute; left:4px; right:4px; bottom:3px; display:flex; gap:4px; justify-content:flex-end;
  }
  .cal-action-btn{
    border:1px solid var(--line); background:#faf9f5; border-radius:5px; width:20px; height:20px;
    font-size:11px; line-height:1; cursor:pointer; padding:0; opacity:.55;
  }
  .cal-action-btn:hover{ opacity:1; background:var(--accent-bg); border-color:var(--accent); }
  .cal-cell .dnum{ font-weight:700; margin-bottom:4px; font-size:12px; }
  .cal-cell.blank{ visibility:hidden; }
  .cal-cell.nodate{ background:#f7f5f0; }
  .cal-cell.nodate .dnum{ color:#c4bfb2; }
  .cal-cell.off{ background:var(--off-bg); }
  .cal-cell.off .dnum{ color:var(--off); }
  .cal-cell.off .cal-note{ color:var(--off); font-weight:700; font-size:11px; line-height:1.3; }
  .cal-cell.duty{ cursor:pointer; }
  .cal-cell.duty:hover{ box-shadow:0 0 0 2px var(--accent) inset; }
  .cal-chip{ display:flex; align-items:center; gap:4px; margin-bottom:3px; cursor:pointer; border-radius:5px; padding:1px 2px; }
  .cal-chip:hover{ background:#f0ede4; }
  .cal-chip-selected{ outline:2px solid var(--accent); background:var(--accent-bg); }
  .cal-circle{
    width:16px; height:16px; min-width:16px; border-radius:50%; display:inline-flex;
    align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; line-height:1;
  }
  .cal-circle.베리타스{ background:var(--veritas); }
  .cal-circle.교사동{ background:var(--gyosa); }
  .cal-chip-name{ font-weight:700; font-size:12px; color:var(--ink); }
  .legend .cal-circle{ width:18px; height:18px; font-size:10px; }
  .addbar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(28,36,48,.45); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-panel{
    background:var(--panel); border-radius:14px; max-width:420px; width:100%;
    padding:18px; box-shadow:0 16px 44px rgba(0,0,0,.28); max-height:85vh; overflow-y:auto;
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
  .modal-header h3{ margin:0; font-size:16px; }
  .modal-slot{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .modal-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .sync-status{ display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:4px 9px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid var(--line); background:#faf9f5; color:#6b6455; }
  .sync-status.online{ color:#1f7a3f; border-color:#b9dcc5; background:#edf8f0; }
  .sync-status.offline{ color:var(--danger); border-color:#e6c2c0; background:#fff1f0; }
  .sync-status.connecting{ color:#6b6455; }
  footer{ text-align:center; color:#a39c8c; font-size:11.5px; padding:20px; }
  @media (max-width:720px){
    main{ padding:14px; } header{ padding:16px; }
    .date-card{ flex-direction:column; align-items:flex-start; }
    .cal-cell{ min-height:64px; font-size:9.5px; padding-bottom:24px; }
    .cal-action-btn{ width:18px; height:18px; }
    .header-title-row{gap:10px;}
    .grade-btn{padding:5px 10px;font-size:11.5px;}
  }

  .header-title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .header-title-row h1{margin:0;}
  .grade-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0;}
  .grade-btn{padding:5px 12px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;}
  .grade-btn.active{background:var(--ink);color:#fff;}
  .grade-label{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:#efeadf;font-size:11px;font-weight:800;}
  .ban-days{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .ban-day{display:inline-flex;align-items:center;gap:3px;font-size:11px;white-space:nowrap;}
  .pair-badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f7;font-size:11px;font-weight:700;}
  .same-place-note{background:#eef4ff;border:1px solid #cad9f5;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px;}
  .sync-status{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
  .sync-status.online{color:#177245;background:#e8f5ee;border-color:#b9dfc9;}
  .sync-status.connecting{color:#7a5b00;background:#fff6d8;border-color:#ead58b;}
  .sync-status.offline{color:var(--danger);background:#fbe6e2;border-color:#e6b9b5;}

  .term-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:4px;}
  .term-controls select{font-size:12px;font-weight:800;padding:5px 8px;border-color:var(--ink);}
  .term-badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef2f7;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .term-info{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .term-copy-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .range-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .range-box input[type=date]{min-width:145px;}

</style>
</head>

<header>
  <div class="header-title-row">
    <h1>📋 자습감독표 관리</h1>
    <div id="headerGradeTabs" class="grade-tabs" aria-label="학년 선택"></div>
    <div class="term-controls" aria-label="학기 선택">
      <select id="academicYearSelect" title="학년도"></select>
      <select id="semesterSelect" title="학기"><option value="1">1학기</option><option value="2">2학기</option></select>
      <button class="btn small" id="openTermBtn" type="button">학기 열기</button>
      <span id="currentTermLabel" class="term-badge"></span>
    </div>
  </div>
  <div class="sub">1·2·3학년 자습감독 통합 관리 · 학년도·학기별 독립 설정 · Firebase 실시간 공유</div>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn" data-view="calendar">달력보기</button>
      <button class="tab-btn" data-view="all">전체보기</button>
      <button class="tab-btn" data-view="byDate">날짜별</button>
      <button class="tab-btn" data-view="byTeacher">선생님별</button>
      <button class="tab-btn" data-view="byPlace">장소별</button>
      <button class="tab-btn" data-view="stats">통계</button>
      <button class="tab-btn" data-view="settings">설정</button>
    </div>
    <div class="spacer"></div>
    <span id="syncStatus" class="sync-status connecting">● Firebase 연결 중...</span>
    <button class="btn" id="undoBtn">↩ 되돌리기</button>
    <button class="btn" id="swapModeBtn">🔁 맞교환 모드</button>
    <button class="btn primary" id="autoGenBtn">⚡ 전체 자동배정 🔒</button>
    <button class="btn danger" id="resetBtn">배정 초기화 🔒</button>
  </div>
</header>

<main id="main"></main>

<footer>변경사항은 Firebase에 실시간 저장·공유됩니다 · 학년도·학기·학년별 데이터와 선생님 설정은 서로 독립적으로 관리됩니다.</footer>

function generateDates(startY,startM,startD,endY,endM,endD){
  const list=[];
  let cur=new Date(startY,startM-1,startD);
  const end=new Date(endY,endM-1,endD);
  while(cur<=end){
    const dow=cur.getDay();
    if(dow>=1 && dow<=4){
      const y=cur.getFullYear(), m=cur.getMonth()+1, d=cur.getDate();
      const id=makeId(y,m,d);
      const label=`${m}월 ${d}일 ${WK[dow]}요일`;
      if(EXCLUDE_REASONS[id]) list.push({id,label,type:'off',note:EXCLUDE_REASONS[id]});
      else list.push({id,label,type:'duty'});
    }
    cur.setDate(cur.getDate()+1);
  }
  return list;
}

  const endYear=y+1;

function weekKeyOf(dateId){

  const monday=new Date(dt); monday.setDate(dt.getDate()-(dow===0?6:dow-1));
  return makeId(monday.getFullYear(),monday.getMonth()+1,monday.getDate());
}

function candidateOrder(gstate, pool, dateId, lastDate, lastWeek, counts){
  const wk=weekKeyOf(dateId);
  const allowed=pool.filter(t=>!isTeacherBannedIn(gstate,t,dateId));
  const noSame=allowed.filter(t=>lastWeek[t.id]!==wk);
  const usable=noSame.length?noSame:allowed;
  return [...usable].sort((a,b)=>{
    if(counts[a.id].total!==counts[b.id].total) return counts[a.id].total-counts[b.id].total;
    const ga=lastDate[a.id]?daysBetween(lastDate[a.id],dateId):9999;
    const gb=lastDate[b.id]?daysBetween(lastDate[b.id],dateId):9999;
    if(ga!==gb) return gb-ga;
    return a.id.localeCompare(b.id);
  });
}
function isTeacherBannedIn(gstate,t,dateId){

function choosePair(gstate,dateId,lastDate,lastWeek,counts){
  const groups={};
  gstate.teachers.forEach(t=>{
    if(!t.pairId) return;
    if(!groups[t.pairId]) groups[t.pairId]=[];
    groups[t.pairId].push(t);
  });
  const wk=weekKeyOf(dateId);
  const eligible=Object.values(groups).filter(arr=>{
    const h=arr.find(t=>t.role==='담임'), v=arr.find(t=>t.role==='부담임');
    return h&&v&&!isTeacherBannedIn(gstate,h,dateId)&&!isTeacherBannedIn(gstate,v,dateId);
  });
  eligible.sort((a,b)=>{
    const ha=a.find(t=>t.role==='담임'), va=a.find(t=>t.role==='부담임');
    const hb=b.find(t=>t.role==='담임'), vb=b.find(t=>t.role==='부담임');
    const sameA=(lastWeek[ha.id]===wk?1:0)+(lastWeek[va.id]===wk?1:0);
    const sameB=(lastWeek[hb.id]===wk?1:0)+(lastWeek[vb.id]===wk?1:0);
    if(sameA!==sameB) return sameA-sameB;
    const costA=counts[ha.id].total+counts[va.id].total;
    const costB=counts[hb.id].total+counts[vb.id].total;
    if(costA!==costB) return costA-costB;
    const gapA=(lastDate[ha.id]?daysBetween(lastDate[ha.id],dateId):9999)+(lastDate[va.id]?daysBetween(lastDate[va.id],dateId):9999);
    const gapB=(lastDate[hb.id]?daysBetween(lastDate[hb.id],dateId):9999)+(lastDate[vb.id]?daysBetween(lastDate[vb.id],dateId):9999);
    return gapB-gapA;
  });
  if(!eligible.length) return null;
  const arr=eligible[0];
  return [arr.find(t=>t.role==='담임'),arr.find(t=>t.role==='부담임')];
}

function preferredLoc(counts,id){ return counts[id].베리타스<=counts[id].교사동?'베리타스':'교사동'; }
function oppositeOf(loc){ return loc==='베리타스'?'교사동':'베리타스'; }

function assignTwo(gstate,dateId,a,b,counts){
  if(!a||!b||a.id===b.id) return;
  const old=currentGrade;
  currentGrade=gstate.grade;
  if(gstate.mode==='single'){
    const loc=singleLocation(gstate);
    setAssign(dateId,a.id,loc); setAssign(dateId,b.id,loc);
  }else{
    let la=preferredLoc(counts,a.id), lb=preferredLoc(counts,b.id);
    if(la===lb){
      const da=Math.abs(counts[a.id].베리타스-counts[a.id].교사동);
      const db=Math.abs(counts[b.id].베리타스-counts[b.id].교사동);
      if(da>=db) lb=oppositeOf(la); else la=oppositeOf(lb);
    }
    setAssign(dateId,a.id,la); setAssign(dateId,b.id,lb);
  }
  currentGrade=old;
}

function runAssignment(mode,cutoffId,opts={}){
  const g=gs();
  if(!opts.silent){
    const msg=mode==='full'
      ? `${currentGrade}학년의 재배정 가능한 전체 일정을 다시 배정할까요?`
      : mode==='from'
        ? '선택한 날짜부터(그 날짜 포함) 이후 일정을 다시 배정합니다. 이전 배정은 유지됩니다. 계속할까요?'
        : '선택한 날짜 이후의 일정만 다시 배정합니다. 계속할까요?';
    if(!confirm(msg)) return;
    if(!opts.noUndo) pushUndo();
  }
  visibleDates().forEach(d=>{
    if(d.type!=='duty'||d.locked) return;
    const inRange=mode==='full'||(mode==='after'&&d.id>cutoffId)||(mode==='from'&&d.id>=cutoffId);
    if(inRange) g.teachers.forEach(t=>setAssign(d.id,t.id,null));
  });

  const lastDate={},lastWeek={};
  g.teachers.forEach(t=>{lastDate[t.id]=null;lastWeek[t.id]=null;});
  const fixed=[];
  visibleDates().forEach(d=>{
    if(d.type!=='duty') return;
    g.teachers.forEach(t=>{if(getAssign(d.id,t.id)) fixed.push({dateId:d.id,teacherId:t.id});});
  });
  fixed.sort((a,b)=>a.dateId.localeCompare(b.dateId)).forEach(x=>{
    lastDate[x.teacherId]=x.dateId; lastWeek[x.teacherId]=weekKeyOf(x.dateId);
  });

  visibleDates().filter(d=>d.type==='duty').forEach(d=>{
    if(g.teachers.some(t=>getAssign(d.id,t.id))) return;
    const counts=computeCounts(g);
    let pair=choosePair(g,d.id,lastDate,lastWeek,counts);
    let a,b;
    if(pair){ [a,b]=pair; }
    else{
      const homes=g.teachers.filter(t=>t.role==='담임');
      const vices=g.teachers.filter(t=>t.role==='부담임');
      a=candidateOrder(g,homes,d.id,lastDate,lastWeek,counts)[0];
      b=candidateOrder(g,vices.filter(t=>!a||t.id!==a.id),d.id,lastDate,lastWeek,counts)[0];
      if(!a||!b){
        const all=candidateOrder(g,g.teachers,d.id,lastDate,lastWeek,counts);
        a=all[0]; b=all.find(t=>t.id!==a?.id);
      }
    }
    if(!a||!b) return;
    assignTwo(g,d.id,a,b,counts);
    lastDate[a.id]=d.id; lastWeek[a.id]=weekKeyOf(d.id);
    lastDate[b.id]=d.id; lastWeek[b.id]=weekKeyOf(d.id);
  });
  if(!opts.silent){ saveState(); render(); }
}

function renderMonthGrid(y,m){
  const box=document.createElement('div'), grid=el('<div class="cal-grid"></div>');
  WK.forEach(w=>grid.appendChild(el(`<div class="cal-wk">${w}</div>`)));
  const startDow=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  for(let i=0;i<startDow;i++) grid.appendChild(el('<div class="cal-cell blank"></div>'));
  for(let d=1;d<=days;d++){
    const id=makeId(y,m,d), entry=gs().dates.find(x=>x.id===id), cell=document.createElement('div');
    if(!entry){cell.className='cal-cell nodate';cell.innerHTML=`<div class="dnum">${d}</div>`;}
    else if(entry.type==='off'){
      cell.className='cal-cell off';cell.innerHTML=`<div class="dnum">${d}</div>${entry.note?`<div class="cal-note">${entry.note}</div>`:''}`;cell.onclick=()=>openDayModal(id);
    }else{
      cell.className='cal-cell duty';cell.appendChild(el(`<div class="dnum">${d}${entry.locked?' 🔒':''}</div>`));
      assignedForDate(id).sort((a,b)=>(a.loc==='교사동'?0:1)-(b.loc==='교사동'?0:1)).forEach(({t,loc})=>{
        const chip = gs().mode==='single'
          ? el(`<div class="cal-chip"><span class="cal-chip-name">${t.name}</span></div>`)
          : el(`<div class="cal-chip"><span class="cal-circle ${loc}">${loc[0]}</span><span class="cal-chip-name">${t.name}</span></div>`);
        if(calSelection&&calSelection.dateId===id&&calSelection.teacherId===t.id) chip.classList.add('cal-chip-selected');
        chip.onclick=ev=>handleCalendarChipClick(id,t.id,ev);cell.appendChild(chip);
      });
      if(!entry.locked){
        const actions=el('<div class="cal-actions"></div>');
        const regen=el('<button class="cal-action-btn" title="이 날짜부터 재배정">🔁</button>');
        const off=el('<button class="cal-action-btn" title="감독없는 날로 지정">🚫</button>');
        regen.onclick=ev=>{ev.stopPropagation();runAssignment('from',id);};off.onclick=ev=>{ev.stopPropagation();designateHoliday(id);};
        actions.append(regen,off);cell.appendChild(actions);
      }
      cell.addEventListener('click',()=>openDayModal(id));
    }
    grid.appendChild(cell);
  }
  box.appendChild(grid);return box;
}

function cellEl(dateId,teacherId){
  const loc=getAssign(dateId,teacherId), div=document.createElement('div');
  div.className='cell '+(loc||'empty');
  div.textContent=loc ? (gs().mode==='single'?'감독':loc==='교사동'?'교':'베') : '·';
  if(swapMode&&swapSelection&&swapSelection.dateId===dateId&&swapSelection.teacherId===teacherId) div.classList.add('selected');
  div.onclick=()=>handleCellClick(dateId,teacherId);return div;
}
function renderAll(main){
  const panel=el(`<div class="panel"><h2>${termLabelOf(ts())} · ${currentGrade}학년 전체보기</h2><p class="hint">칸을 클릭해 직접 배정할 수 있습니다. 설정에서 체크 해제한 요일에는 자동배정되지 않습니다.</p></div>`);

function renderSettings(main){
  const term=ts();
  const tp=el(`<div class="panel"><h2>학기 설정 · ${termLabelOf(term)}</h2><p class="hint">이 학기의 선생님·짝·가능요일·감독배정·휴무는 다른 학기와 독립적으로 저장됩니다. 새 학기를 만들 때 빈 설정 또는 현재 학기 설정 복사를 선택할 수 있습니다.</p></div>`);
  const sourceSel=document.createElement('select');sourceSel.id='copySourceTerm';
  sortedTermKeys().filter(k=>k!==currentTermKey).forEach(k=>sourceSel.appendChild(new Option(termLabelOf(appState.terms[k]),k)));
  const row=el('<div class="term-copy-row"></div>');row.appendChild(sourceSel);
  const copyGrade=el('<button class="btn small">기존 학기에서 현재 학년 설정 복사</button>');
  const copyAll=el('<button class="btn small">기존 학기에서 전학년 설정 복사</button>');
  if(!sourceSel.options.length){copyGrade.disabled=true;copyAll.disabled=true;sourceSel.appendChild(new Option('복사할 기존 학기 없음',''));}
  copyGrade.onclick=()=>{const src=sourceSel.value;if(!src)return;if(confirm(`${termLabelOf(appState.terms[src])}의 ${currentGrade}학년 선생님·짝·가능요일 설정을 복사할까요? 현재 학년의 배정은 비워집니다.`))copySettingsBetweenTerms(src,currentTermKey,'grade');};
  copyAll.onclick=()=>{const src=sourceSel.value;if(!src)return;if(confirm(`${termLabelOf(appState.terms[src])}의 1·2·3학년 선생님 설정을 모두 복사할까요? 현재 학기의 기존 배정은 비워집니다.`))copySettingsBetweenTerms(src,currentTermKey,'all');};
  row.append(copyGrade,copyAll);tp.appendChild(row);main.appendChild(tp);

  const panel=el(`<div class="panel"><h2>${currentGrade}학년 선생님 관리</h2><p class="hint">배정 가능 요일에 체크하세요. 체크를 해제한 요일은 자동배정·맞교환에서 배정금지로 처리됩니다. 같은 짝 번호의 담임·부담임이 기본 조합입니다.</p></div>`);
  const wrap=el('<div style="overflow:auto;"></div>'),table=el('<table class="grid"></table>');
  table.innerHTML='<thead><tr><th>이름</th><th>역할</th><th>짝</th><th>배정 가능 요일</th><th></th></tr></thead>';
  const tb=document.createElement('tbody');
  gs().teachers.forEach(t=>{
    const tr=document.createElement('tr');
    const maxPair=Math.max(7,gs().teachers.length);const pairOpts=['',...Array.from({length:maxPair},(_,i)=>String(i+1))].map(v=>`<option value="${v}" ${String(t.pairId||'')===v?'selected':''}>${v||'없음'}</option>`).join('');
    const allowed=DAY_OPTIONS.map(d=>`<label class="ban-day"><input type="checkbox" class="available-check" data-id="${t.id}" value="${d.v}" ${!(t.bannedDays||[]).map(Number).includes(d.v)?'checked':''}>${d.t}</label>`).join('');
    tr.innerHTML=`<td><input type="text" class="t-name" data-id="${t.id}" value="${t.name}"></td>
      <td><select class="t-role" data-id="${t.id}"><option value="담임" ${t.role==='담임'?'selected':''}>담임</option><option value="부담임" ${t.role==='부담임'?'selected':''}>부담임</option></select></td>
      <td><select class="t-pair" data-id="${t.id}">${pairOpts}</select></td>
      <td><div class="ban-days">${allowed}</div></td>
      <td><button class="btn danger small t-del" data-id="${t.id}">삭제</button></td>`;tb.appendChild(tr);
  });table.appendChild(tb);wrap.appendChild(table);panel.appendChild(wrap);
  panel.appendChild(el(`<div class="addbar"><input type="text" id="newTeacherName" placeholder="새 선생님 이름"><select id="newTeacherRole"><option>담임</option><option>부담임</option></select><input type="text" id="newTeacherPair" placeholder="짝 번호" style="width:85px"><button class="btn primary small" id="addTeacherBtn">추가</button></div>`));main.appendChild(panel);
  panel.querySelectorAll('.t-name').forEach(x=>x.onchange=e=>{const t=gs().teachers.find(t=>t.id===e.target.dataset.id);if(t){pushUndo();t.name=e.target.value.trim()||t.name;saveState();render();}});
  panel.querySelectorAll('.t-role').forEach(x=>x.onchange=e=>{const t=gs().teachers.find(t=>t.id===e.target.dataset.id);if(t){pushUndo();t.role=e.target.value;saveState();render();}});
  panel.querySelectorAll('.t-pair').forEach(x=>x.onchange=e=>{const t=gs().teachers.find(t=>t.id===e.target.dataset.id);if(t){pushUndo();t.pairId=e.target.value;saveState();render();}});
  panel.querySelectorAll('.available-check').forEach(x=>x.onchange=e=>{const t=gs().teachers.find(t=>t.id===e.target.dataset.id);if(!t)return;pushUndo();const checked=[...panel.querySelectorAll(`.available-check[data-id="${t.id}"]:checked`)].map(c=>Number(c.value));t.bannedDays=DAY_OPTIONS.map(d=>d.v).filter(v=>!checked.includes(v));saveState();render();});
  panel.querySelectorAll('.t-del').forEach(x=>x.onclick=e=>{const id=e.target.dataset.id,t=gs().teachers.find(t=>t.id===id);if(!confirm(`${t.name} 선생님을 삭제할까요?`))return;pushUndo();gs().teachers=gs().teachers.filter(t=>t.id!==id);Object.keys(gs().assignments).forEach(k=>{if(k.endsWith('__'+id))delete gs().assignments[k];});saveState();render();});
  document.getElementById('addTeacherBtn').onclick=()=>{const name=document.getElementById('newTeacherName').value.trim();if(!name){alert('이름을 입력하세요.');return;}pushUndo();gs().teachers.push({id:`g${currentGrade}_${currentTermKey.replace('-','_')}_${Date.now()}`,name,role:document.getElementById('newTeacherRole').value,pairId:document.getElementById('newTeacherPair').value.trim(),bannedDays:[]});saveState();render();};

  const info=el(`<div class="panel"><h2>자동배정 원칙</h2><p class="hint">1) 같은 짝 번호의 담임 1명 + 부담임 1명을 우선합니다. 2) 체크된 배정 가능 요일만 후보가 됩니다. 3) 1학년은 두 명 모두 베리타스홀, 3학년은 두 명 모두 교사동이며 장소 표시는 생략합니다. 4) 학기가 바뀌면 선생님·짝·가능요일은 새 학기에서 별도로 설정합니다.</p></div>`);main.appendChild(info);

  const hp=el(`<div class="panel"><h2>휴무·방학 일괄 등록</h2><p class="hint">현재 학기 범위 안에서 시작일~종료일의 월·화·수·목 감독일을 한 번에 휴무로 지정합니다. 하루만 지정하려면 시작일과 종료일을 같게 선택하세요.</p><div class="range-box"><input type="date" id="holidayStart" min="${term.startDate}" max="${term.endDate}" value="${term.startDate}"><span>~</span><input type="date" id="holidayEnd" min="${term.startDate}" max="${term.endDate}" value="${term.startDate}"><input type="text" id="holidayReason" placeholder="사유 (예: 겨울방학)"><button class="btn primary small" id="addHolidayRangeBtn">기간 휴무 등록</button><button class="btn small" id="clearHolidayRangeBtn">기간 휴무 해제</button></div></div>`);main.appendChild(hp);
  function forEachRangeDate(startId,endId,fn){let d=new Date(startId+'T00:00:00'),e=new Date(endId+'T00:00:00');while(d<=e){const id=makeId(d.getFullYear(),d.getMonth()+1,d.getDate()),dow=d.getDay();if(dow>=1&&dow<=4&&isInCurrentTerm(id))fn(id,dow);d.setDate(d.getDate()+1);}}
  document.getElementById('addHolidayRangeBtn').onclick=()=>{let a=document.getElementById('holidayStart').value,b=document.getElementById('holidayEnd').value;if(!a||!b){alert('시작일과 종료일을 선택하세요.');return;}if(a>b)[a,b]=[b,a];if(!isInCurrentTerm(a)||!isInCurrentTerm(b)){alert('현재 학기 범위 안의 날짜를 선택하세요.');return;}const reason=document.getElementById('holidayReason').value.trim()||'휴무';pushUndo();let changed=0,locked=0;forEachRangeDate(a,b,(id,dow)=>{let d=gs().dates.find(x=>x.id===id);if(d?.locked){locked++;return;}if(!d){const [y,m,dd]=id.split('-').map(Number);d={id,label:`${m}월 ${dd}일 ${WK[dow]}요일`,type:'duty'};gs().dates.push(d);}d.type='off';d.note=reason;clearDate(id);changed++;});gs().dates.sort((x,y)=>x.id.localeCompare(y.id));saveState();render();alert(`${changed}개 감독일을 휴무로 등록했습니다.${locked?` 고정일 ${locked}개는 제외했습니다.`:''}`);};
  document.getElementById('clearHolidayRangeBtn').onclick=()=>{let a=document.getElementById('holidayStart').value,b=document.getElementById('holidayEnd').value;if(!a||!b)return;if(a>b)[a,b]=[b,a];pushUndo();let changed=0;forEachRangeDate(a,b,id=>{const d=gs().dates.find(x=>x.id===id);if(d&&!d.locked&&d.type==='off'){d.type='duty';delete d.note;clearDate(id);changed++;}});saveState();render();alert(`${changed}개 날짜를 감독일로 되돌렸습니다. 필요하면 전체 자동배정을 실행하세요.`);};

  const rp=el(`<div class="panel"><h2>비밀번호 변경</h2><p class="hint">전체 자동배정과 배정 초기화에 사용하는 공통 비밀번호입니다.</p><div class="addbar"><input type="password" id="curPw" placeholder="현재 비밀번호"><input type="password" id="newPw" placeholder="새 비밀번호"><button class="btn primary small" id="changePwBtn">변경</button></div></div>`);main.appendChild(rp);
  document.getElementById('changePwBtn').onclick=()=>{const c=document.getElementById('curPw').value,n=document.getElementById('newPw').value;if(c!==appState.password){alert('현재 비밀번호가 올바르지 않습니다.');return;}if(!n){alert('새 비밀번호를 입력하세요.');return;}appState.password=n;saveState();alert('변경되었습니다.');};
}

document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;swapSelection=null;calSelection=null;render();});
document.getElementById('openTermBtn').onclick=()=>{const y=Number(document.getElementById('academicYearSelect').value),sem=Number(document.getElementById('semesterSelect').value),k=termKeyOf(y,sem);if(appState.terms[k])switchToTerm(k);else openTermCreateModal(y,sem);};

document.getElementById('autoGenBtn').onclick=()=>checkPasswordThen(`${termLabelOf(ts())} ${currentGrade}학년 전체 자동배정`,()=>runAssignment('full',null));
document.getElementById('resetBtn').onclick=()=>checkPasswordThen(`${termLabelOf(ts())} ${currentGrade}학년 배정 초기화`,()=>{
  if(!confirm(`${termLabelOf(ts())} ${currentGrade}학년의 감독 배정과 휴무를 초기화할까요? 선생님·짝·가능요일 설정은 유지됩니다.`))return;
