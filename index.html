    --ink:#1c2430;
    --paper:#f5f3ee;
    --panel:#ffffff;
    --line:#dfd9cc;
    --veritas:#1d5fd6;
    --veritas-bg:#dde8fb;
    --gyosa:#d9560c;
    --gyosa-bg:#fbe6d6;
    --accent:#b5542a;
    --accent-bg:#f6e6dc;
    --off:#9a9488;
    --off-bg:#eeece5;
    --danger:#b0413e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;
  }
  header{
    padding:22px 24px 16px; border-bottom:2px solid var(--ink); background:var(--panel);
    position:sticky; top:0; z-index:20;
  }
  header h1{ margin:0 0 4px; font-size:20px; letter-spacing:-0.02em; }
  header .sub{ color:#6b6455; font-size:12.5px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn{
    padding:7px 14px; border-radius:999px; border:1.5px solid var(--ink); background:transparent;
    font-size:13px; cursor:pointer; color:var(--ink); font-weight:600;
  }
  .tab-btn.active{ background:var(--ink); color:#fff; }
  .spacer{flex:1;}
  .btn{
    padding:7px 13px; border-radius:8px; border:1.5px solid var(--ink); background:var(--panel);
    font-size:12.5px; cursor:pointer; font-weight:600; color:var(--ink);
  }
  .btn:hover{ background:#efece3; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ border-color:var(--danger); color:var(--danger); }
  .btn.small{ padding:4px 9px; font-size:11px; }
  .btn.toggle-on{ background:var(--ink); color:#fff; }
  .btn.icon{ padding:6px 10px; font-size:14px; line-height:1; }
  main{ padding:20px 24px 60px; max-width:1400px; margin:0 auto; }
  .panel{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:18px;
  }
  .panel h2{ margin:0 0 12px; font-size:15px; }
  .hint{ font-size:12px; color:#847d6c; margin:0 0 12px; }

  table.grid{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.grid th, table.grid td{ border:1px solid var(--line); padding:6px 8px; text-align:center; white-space:nowrap; }
  table.grid thead th{ background:#efeadf; position:sticky; top:0; }
  table.grid .date-col{ text-align:left; position:sticky; left:0; background:#efeadf; font-weight:600; min-width:150px; }
  table.grid tbody tr:nth-child(even) td:not(.date-col){ background:#fbfaf6; }

    width:100%; border:none; background:transparent; text-align:center; font-weight:700; font-size:12.5px;

  }

  .cell{ cursor:pointer; border-radius:6px; padding:5px 4px; font-weight:700; min-width:52px; transition:transform .06s; }
  .cell:hover{ transform:scale(1.04); }
  .cell.empty{ color:#c4bfb2; }
  .cell.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .cell.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }
  .cell.selected{ outline:2.5px solid var(--accent); }
  tr.off-row td{ background:var(--off-bg) !important; color:var(--off); font-style:italic; }
  tr.off-row .off-note{ text-align:center; font-weight:700; }

  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge.베리타스{ background:var(--veritas-bg); color:var(--veritas); }
  .badge.교사동{ background:var(--gyosa-bg); color:var(--gyosa); }
  .badge.role-담임{ background:var(--accent-bg); color:var(--accent); }
  .badge.role-부담임{ background:#e7e3d8; color:#6b6455; }

  .stats-table td.name-cell{ text-align:left; font-weight:700; }
  .stats-table td.unbalanced{ background:#fbe6e2; color:var(--danger); font-weight:700; }

  select, input[type=text], input[type=date], input[type=password]{
    font-family:inherit; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink);

  .place-col{ flex:1; min-width:260px; }
  .place-col h3{ margin:0 0 8px; font-size:13.5px; }
  .place-col .duty-list{ border:1.5px solid var(--line); border-radius:8px; overflow:hidden; }

  .cal-cell.blank{ visibility:hidden; }

  .cal-cell.off{ background:var(--off-bg); }

function pad2(n){ return String(n).padStart(2,'0'); }
function makeId(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function generateDates(startY,startM,startD,endY,endM,endD){
  const list=[];
  let cur=new Date(startY,startM-1,startD);
  const end=new Date(endY,endM-1,endD);
  while(cur<=end){
    const dow=cur.getDay();
    if(dow>=1 && dow<=4){
      const y=cur.getFullYear(), m=cur.getMonth()+1, d=cur.getDate();
      const id=makeId(y,m,d);
      const label=`${m}월 ${d}일 ${WK[dow]}요일`;
      if(EXCLUDE_REASONS[id]) list.push({id,label,type:'off',note:EXCLUDE_REASONS[id]});
      else list.push({id,label,type:'duty'});
    }
    cur.setDate(cur.getDate()+1);
  }

}

function makeTeachers(grade, homes, vices){

  homes.forEach((name,i)=>{
    arr.push({
      id: grade==='2' ? `t${i+1}` : `g${grade}h${i+1}`,
      name, role:'담임', pairId:String(i+1), bannedDays:[]
    });
  });
  vices.forEach((name,i)=>{
    arr.push({
      id: grade==='2' ? `t${8+i}` : `g${grade}v${i+1}`,
      name, role:'부담임', pairId:String(i+1), bannedDays:[]
    });
  });
  return arr;
}

function makeGradeState(grade){

let currentGrade='2';

const UNDO_LIMIT=30;

function gs(){ return appState.grades[currentGrade]; }
function locations(){ return gs().mode==='single' ? ['교사동'] : ['교사동','베리타스']; }
function key(dateId,teacherId){ return dateId+'__'+teacherId; }
function getAssign(dateId,teacherId){ return gs().assignments[key(dateId,teacherId)] || null; }
function setAssign(dateId,teacherId,loc){ const k=key(dateId,teacherId); if(loc) gs().assignments[k]=loc; else delete gs().assignments[k]; }
function dutyDates(){ return gs().dates.filter(d=>d.type==='duty'); }
function dateDow(dateId){ return new Date(dateId+'T00:00:00').getDay(); }
function isBanned(t,dateId){ return (t.bannedDays||[]).map(Number).includes(dateDow(dateId)); }
function assignedForDate(dateId){
  return gs().teachers.map(t=>({t,loc:getAssign(dateId,t.id)})).filter(x=>x.loc);
}
function clearDate(dateId){ gs().teachers.forEach(t=>setAssign(dateId,t.id,null)); }
function availableMonths(){ return [...new Set(gs().dates.map(d=>d.id.slice(0,7)))].sort(); }
function todayYM(){ const t=new Date(); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}`; }
function ensureSelectedMonth(){
  const months=availableMonths();
  if(!months.length) return;
  if(selectedMonth && months.includes(selectedMonth)) return;
  const ym=todayYM();
  selectedMonth=months.includes(ym)?ym:(months.find(m=>m>=ym)||months[months.length-1]);
}

function addPairMetadataToLegacyGrade(g){
  const homes=g.teachers.filter(t=>t.role==='담임');
  const vices=g.teachers.filter(t=>t.role==='부담임');
  homes.forEach((t,i)=>{ if(!t.pairId) t.pairId=String(i+1); if(!Array.isArray(t.bannedDays)) t.bannedDays=[]; });
  vices.forEach((t,i)=>{ if(!t.pairId) t.pairId=String(i+1); if(!Array.isArray(t.bannedDays)) t.bannedDays=[]; });
  g.mode=g.mode||'dual';
  g.settings=g.settings||{};
  return g;
}

function normalizeRemoteState(raw){
  if(raw && raw.version===2 && raw.grades){
    const root=raw;
    root.password=root.password || '5689';
    ['1','2','3'].forEach(g=>{
      if(!root.grades[g]) root.grades[g]=makeGradeState(g);
      root.grades[g]=addPairMetadataToLegacyGrade(root.grades[g]);
      if(!root.grades[g].assignments) root.grades[g].assignments={};
      if(!Array.isArray(root.grades[g].dates)) root.grades[g].dates=makeGradeState(g).dates;
    });
    root.grades['3'].mode='single';
    return {root,migrated:false};
  }
  if(raw && Array.isArray(raw.teachers) && Array.isArray(raw.dates)){
    const root={
      version:2,
      password:(raw.settings&&raw.settings.password)||'5689',
      grades:{
        '1':makeGradeState('1'),
        '2':addPairMetadataToLegacyGrade({
          grade:'2',mode:'dual',teachers:raw.teachers,dates:raw.dates,
          assignments:raw.assignments||{},settings:{}
        }),
        '3':makeGradeState('3')
      }
    };
    autoAssignInitial(root.grades['1']);
    autoAssignInitial(root.grades['3']);
    return {root,migrated:true};
  }
  return null;
}

    }
  }catch(e){}

function saveState(){

  changes[`grades/${currentGrade}`]=clone(gs());
  update(REMOTE_STATE_REF,changes)
    .then(()=>{ if(firebaseConnected) updateSyncStatus('online','● 실시간 공유 중'); })
    .catch(err=>{ console.error(err); updateSyncStatus('offline','● 저장 실패 · 로컬 백업됨'); });
}
function initRealtimeSync(){
  updateSyncStatus('connecting','● Firebase 연결 중...');
  onValue(CONNECTED_REF,snap=>{
    firebaseConnected=snap.val()===true;
    updateSyncStatus(firebaseConnected?'online':'offline',
      firebaseConnected ? (firebaseInitialLoaded?'● 실시간 공유 중':'● 서버 연결됨 · 데이터 확인 중') : '● 오프라인 · 로컬 백업 중');
  });
  onValue(REMOTE_STATE_REF,async snap=>{
    if(!firebaseInitialLoaded){
      firebaseInitialLoaded=true;
      if(snap.exists()){
        const n=normalizeRemoteState(snap.val());
        if(n){
          appState=n.root;
          undoStack=[];
          saveLocalBackup();
          render();
          if(n.migrated){
            updateSyncStatus('connecting','● 전학년 구조로 변환 중...');
            await set(REMOTE_STATE_REF,clone(appState));
          }
        }
      }else{
        if(!appState) appState=defaultRootState();
        await set(REMOTE_STATE_REF,clone(appState));
      }
      updateSyncStatus(firebaseConnected?'online':'offline',firebaseConnected?'● 실시간 공유 중':'● 오프라인 · 로컬 백업 중');
      return;
    }
    if(snap.exists()){
      const n=normalizeRemoteState(snap.val());
      if(n){
        appState=n.root;
        saveLocalBackup();
        render();
      }
    }
  });
}

function computeCounts(gstate=gs()){
  const counts={};
  gstate.teachers.forEach(t=>counts[t.id]={베리타스:0,교사동:0,total:0});
  Object.entries(gstate.assignments||{}).forEach(([k,loc])=>{
    const teacherId=k.split('__')[1];
    if(counts[teacherId]){
      if(loc==='베리타스') counts[teacherId].베리타스++;
      else counts[teacherId].교사동++;
      counts[teacherId].total++;
    }
  });
  return counts;
}
function weekKeyOf(dateId){
  const dt=new Date(dateId+'T00:00:00'), dow=dt.getDay();
  const monday=new Date(dt); monday.setDate(dt.getDate()-(dow===0?6:dow-1));
  return makeId(monday.getFullYear(),monday.getMonth()+1,monday.getDate());
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

function candidateOrder(gstate, pool, dateId, lastDate, lastWeek, counts){
  const wk=weekKeyOf(dateId);
  const allowed=pool.filter(t=>!isTeacherBannedIn(gstate,t,dateId));
  const noSame=allowed.filter(t=>lastWeek[t.id]!==wk);
  const usable=noSame.length?noSame:allowed;
  return [...usable].sort((a,b)=>{
    if(counts[a.id].total!==counts[b.id].total) return counts[a.id].total-counts[b.id].total;
    const ga=lastDate[a.id]?daysBetween(lastDate[a.id],dateId):9999;
    const gb=lastDate[b.id]?daysBetween(lastDate[b.id],dateId):9999;
    if(ga!==gb) return gb-ga;
    return a.id.localeCompare(b.id);
  });
}
function isTeacherBannedIn(gstate,t,dateId){
  return (t.bannedDays||[]).map(Number).includes(dateDow(dateId));
}

function choosePair(gstate,dateId,lastDate,lastWeek,counts){
  const groups={};
  gstate.teachers.forEach(t=>{
    if(!t.pairId) return;
    if(!groups[t.pairId]) groups[t.pairId]=[];
    groups[t.pairId].push(t);
  });
  const wk=weekKeyOf(dateId);
  const eligible=Object.values(groups).filter(arr=>{
    const h=arr.find(t=>t.role==='담임'), v=arr.find(t=>t.role==='부담임');
    return h&&v&&!isTeacherBannedIn(gstate,h,dateId)&&!isTeacherBannedIn(gstate,v,dateId);
  });
  eligible.sort((a,b)=>{
    const ha=a.find(t=>t.role==='담임'), va=a.find(t=>t.role==='부담임');
    const hb=b.find(t=>t.role==='담임'), vb=b.find(t=>t.role==='부담임');
    const sameA=(lastWeek[ha.id]===wk?1:0)+(lastWeek[va.id]===wk?1:0);
    const sameB=(lastWeek[hb.id]===wk?1:0)+(lastWeek[vb.id]===wk?1:0);
    if(sameA!==sameB) return sameA-sameB;
    const costA=counts[ha.id].total+counts[va.id].total;
    const costB=counts[hb.id].total+counts[vb.id].total;
    if(costA!==costB) return costA-costB;
    const gapA=(lastDate[ha.id]?daysBetween(lastDate[ha.id],dateId):9999)+(lastDate[va.id]?daysBetween(lastDate[va.id],dateId):9999);
    const gapB=(lastDate[hb.id]?daysBetween(lastDate[hb.id],dateId):9999)+(lastDate[vb.id]?daysBetween(lastDate[vb.id],dateId):9999);
    return gapB-gapA;
  });
  if(!eligible.length) return null;
  const arr=eligible[0];
  return [arr.find(t=>t.role==='담임'),arr.find(t=>t.role==='부담임')];
}

function preferredLoc(counts,id){ return counts[id].베리타스<=counts[id].교사동?'베리타스':'교사동'; }
function oppositeOf(loc){ return loc==='베리타스'?'교사동':'베리타스'; }

function assignTwo(gstate,dateId,a,b,counts){
  if(!a||!b||a.id===b.id) return;
  const old=currentGrade;
  currentGrade=gstate.grade;
  if(gstate.mode==='single'){
    setAssign(dateId,a.id,'교사동'); setAssign(dateId,b.id,'교사동');
  }else{
    let la=preferredLoc(counts,a.id), lb=preferredLoc(counts,b.id);
    if(la===lb){
      const da=Math.abs(counts[a.id].베리타스-counts[a.id].교사동);
      const db=Math.abs(counts[b.id].베리타스-counts[b.id].교사동);
      if(da>=db) lb=oppositeOf(la); else la=oppositeOf(lb);
    }
    setAssign(dateId,a.id,la); setAssign(dateId,b.id,lb);
  }
  currentGrade=old;
}

function autoAssignInitial(gstate){
  const oldApp=appState, oldGrade=currentGrade;
  appState={version:2,password:'5689',grades:{[gstate.grade]:gstate}};
  currentGrade=gstate.grade;
  runAssignment('full',null,{silent:true,noUndo:true});
  currentGrade=oldGrade;
  appState=oldApp;
}

function runAssignment(mode,cutoffId,opts={}){
  const g=gs();
  if(!opts.silent){
    const msg=mode==='full'
      ? `${currentGrade}학년의 재배정 가능한 전체 일정을 다시 배정할까요?`
      : mode==='from'
        ? '선택한 날짜부터(그 날짜 포함) 이후 일정을 다시 배정합니다. 이전 배정은 유지됩니다. 계속할까요?'
        : '선택한 날짜 이후의 일정만 다시 배정합니다. 계속할까요?';
    if(!confirm(msg)) return;
    if(!opts.noUndo) pushUndo();
  }
  g.dates.forEach(d=>{
    if(d.type!=='duty'||d.locked) return;
    const inRange=mode==='full'||(mode==='after'&&d.id>cutoffId)||(mode==='from'&&d.id>=cutoffId);
    if(inRange) g.teachers.forEach(t=>setAssign(d.id,t.id,null));
  });

  const lastDate={},lastWeek={};
  g.teachers.forEach(t=>{lastDate[t.id]=null;lastWeek[t.id]=null;});
  const fixed=[];
  g.dates.forEach(d=>{
    if(d.type!=='duty') return;
    g.teachers.forEach(t=>{if(getAssign(d.id,t.id)) fixed.push({dateId:d.id,teacherId:t.id});});
  });
  fixed.sort((a,b)=>a.dateId.localeCompare(b.dateId)).forEach(x=>{
    lastDate[x.teacherId]=x.dateId; lastWeek[x.teacherId]=weekKeyOf(x.dateId);
  });

  g.dates.filter(d=>d.type==='duty').forEach(d=>{
    if(g.teachers.some(t=>getAssign(d.id,t.id))) return;
    const counts=computeCounts(g);
    let pair=choosePair(g,d.id,lastDate,lastWeek,counts);
    let a,b;
    if(pair){ [a,b]=pair; }
    else{
      const homes=g.teachers.filter(t=>t.role==='담임');
      const vices=g.teachers.filter(t=>t.role==='부담임');
      a=candidateOrder(g,homes,d.id,lastDate,lastWeek,counts)[0];
      b=candidateOrder(g,vices.filter(t=>!a||t.id!==a.id),d.id,lastDate,lastWeek,counts)[0];
      if(!a||!b){
        const all=candidateOrder(g,g.teachers,d.id,lastDate,lastWeek,counts);
        a=all[0]; b=all.find(t=>t.id!==a?.id);
      }
    }
    if(!a||!b) return;
    assignTwo(g,d.id,a,b,counts);
    lastDate[a.id]=d.id; lastWeek[a.id]=weekKeyOf(d.id);
    lastDate[b.id]=d.id; lastWeek[b.id]=weekKeyOf(d.id);
  });
  if(!opts.silent){ saveState(); render(); }
}

    const a=s1.select.value,b=s2.select.value;
    if(a&&b&&a===b){alert('같은 선생님을 두 자리 모두 배정할 수 없습니다.');return;}
    pushUndo();clearDate(dateId);
    if(a) setAssign(dateId,a,'교사동');
    if(b) setAssign(dateId,b,gs().mode==='single'?'교사동':'베리타스');
    saveState();render();closeDayModal();
  };
  box.appendChild(saveBtn);

  if(!d.locked){
    const actions=el('<div class="modal-actions"></div>');
    const regen=el('<button class="btn small">🔁 이 날짜부터 재배정</button>');
    const off=el('<button class="btn small">🚫 감독없는 날</button>');
    regen.onclick=()=>{closeDayModal();runAssignment('from',dateId);};
    off.onclick=()=>{closeDayModal();designateHoliday(dateId);};
    actions.append(regen,off);box.appendChild(actions);
  }
}

function swapTeachers(dateA,teacherA,dateB,teacherB){
  const ta=gs().teachers.find(t=>t.id===teacherA), tb=gs().teachers.find(t=>t.id===teacherB);
  if(!ta||!tb) return;
  if(isBanned(ta,dateB)||isBanned(tb,dateA)){
    alert('맞교환 후 배정금지 요일에 해당하는 선생님이 생겨 교환할 수 없습니다.'); return;
  }
  pushUndo();
  const la=getAssign(dateA,teacherA), lb=getAssign(dateB,teacherB);
  setAssign(dateA,teacherA,null); setAssign(dateB,teacherB,null);
  setAssign(dateA,teacherB,la); setAssign(dateB,teacherA,lb);
  saveState();
}
function handleCalendarChipClick(dateId,teacherId,ev){
  ev&&ev.stopPropagation();
  if(!calSelection){calSelection={dateId,teacherId};render();return;}
  if(calSelection.dateId===dateId&&calSelection.teacherId===teacherId){calSelection=null;render();return;}
  swapTeachers(calSelection.dateId,calSelection.teacherId,dateId,teacherId); calSelection=null; render();
}
function cycleAssign(dateId,teacherId){
  const t=gs().teachers.find(x=>x.id===teacherId);
  if(isBanned(t,dateId)){alert(`${t.name} 선생님은 해당 요일이 배정금지로 설정되어 있습니다.`);return;}
  pushUndo(); const cur=getAssign(dateId,teacherId);
  const next=gs().mode==='single' ? (cur?null:'교사동') : (cur===null?'교사동':(cur==='교사동'?'베리타스':null));
  setAssign(dateId,teacherId,next); saveState(); render();
}
function handleCellClick(dateId,teacherId){
  if(!swapMode){cycleAssign(dateId,teacherId);return;}
  if(!swapSelection){swapSelection={dateId,teacherId};render();return;}
  if(swapSelection.dateId===dateId&&swapSelection.teacherId===teacherId){swapSelection=null;render();return;}
  swapTeachers(swapSelection.dateId,swapSelection.teacherId,dateId,teacherId); swapSelection=null; render();
}

function renderTabs(){

}
function render(){

function renderCalendar(main){
  ensureSelectedMonth();
  const panel=el('<div class="panel"></div>');
  panel.innerHTML='<h2>달력보기</h2>';
  if(gs().mode==='single') panel.appendChild(el('<div class="same-place-note">3학년: 두 명 모두 교사동 감독 · 장소 구분 없음</div>'));
  panel.appendChild(el(`<p class="hint">${currentGrade}학년 감독표입니다. 이름을 클릭한 뒤 다른 날짜의 이름을 클릭하면 맞교환됩니다. 설정에서 선생님별 배정금지 요일을 지정할 수 있습니다.</p>`));
  const legend=el('<div class="legend"></div>');
  if(gs().mode==='dual'){
    legend.append(el('<span class="swatch"><span class="cal-circle 베리타스">베</span>베리타스홀</span>'),
      el('<span class="swatch"><span class="cal-circle 교사동">교</span>교사동</span>'));
  }
  legend.appendChild(el('<span class="swatch"><span class="dot" style="background:var(--off);"></span>휴무 / 제외일</span>'));
  panel.appendChild(legend);
  if(calSelection){
    const d=(gs().dates.find(x=>x.id===calSelection.dateId)||{}).label||calSelection.dateId;
    const t=(gs().teachers.find(x=>x.id===calSelection.teacherId)||{}).name||'';
    panel.appendChild(el(`<div class="swap-note">🔁 ${d} · ${t} 선택됨 → 바꿀 상대 이름을 클릭하세요.</div>`));
  }
  const nav=el('<div class="month-nav"></div>');
  const prev=el('<button class="btn icon">◀</button>'), next=el('<button class="btn icon">▶</button>');
  const sel=document.createElement('select');
  const months=availableMonths();
  months.forEach(ym=>{const [y,m]=ym.split('-').map(Number);const o=new Option(`${y}년 ${m}월`,ym);o.selected=ym===selectedMonth;sel.appendChild(o);});
  const today=el('<button class="btn small">오늘</button>');
  nav.append(prev,sel,next,today);panel.appendChild(nav);
  const gridBox=document.createElement('div');panel.appendChild(gridBox);main.appendChild(panel);
  const draw=()=>{gridBox.innerHTML='';const [y,m]=selectedMonth.split('-').map(Number);gridBox.appendChild(renderMonthGrid(y,m));};
  draw();
  sel.onchange=e=>{selectedMonth=e.target.value;draw();};
  prev.onclick=()=>{const i=months.indexOf(selectedMonth);if(i>0){selectedMonth=months[i-1];sel.value=selectedMonth;draw();}};
  next.onclick=()=>{const i=months.indexOf(selectedMonth);if(i<months.length-1){selectedMonth=months[i+1];sel.value=selectedMonth;draw();}};
  today.onclick=()=>{const ym=todayYM();selectedMonth=months.includes(ym)?ym:(months.find(x=>x>=ym)||months[months.length-1]);sel.value=selectedMonth;draw();};
}

function renderMonthGrid(y,m){
  const box=document.createElement('div'), grid=el('<div class="cal-grid"></div>');
  WK.forEach(w=>grid.appendChild(el(`<div class="cal-wk">${w}</div>`)));
  const startDow=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  for(let i=0;i<startDow;i++) grid.appendChild(el('<div class="cal-cell blank"></div>'));
  for(let d=1;d<=days;d++){
    const id=makeId(y,m,d), entry=gs().dates.find(x=>x.id===id), cell=document.createElement('div');
    if(!entry){cell.className='cal-cell nodate';cell.innerHTML=`<div class="dnum">${d}</div>`;}
    else if(entry.type==='off'){
      cell.className='cal-cell off';cell.innerHTML=`<div class="dnum">${d}</div>${entry.note?`<div class="cal-note">${entry.note}</div>`:''}`;cell.onclick=()=>openDayModal(id);
    }else{
      cell.className='cal-cell duty';cell.appendChild(el(`<div class="dnum">${d}${entry.locked?' 🔒':''}</div>`));
      assignedForDate(id).sort((a,b)=>(a.loc==='교사동'?0:1)-(b.loc==='교사동'?0:1)).forEach(({t,loc})=>{
        const chip = gs().mode==='single'
          ? el(`<div class="cal-chip"><span class="cal-chip-name">${t.name}</span></div>`)
          : el(`<div class="cal-chip"><span class="cal-circle ${loc}">${loc[0]}</span><span class="cal-chip-name">${t.name}</span></div>`);
        if(calSelection&&calSelection.dateId===id&&calSelection.teacherId===t.id) chip.classList.add('cal-chip-selected');
        chip.onclick=ev=>handleCalendarChipClick(id,t.id,ev);cell.appendChild(chip);
      });
      if(!entry.locked){
        const actions=el('<div class="cal-actions"></div>');
        const regen=el('<button class="cal-action-btn" title="이 날짜부터 재배정">🔁</button>');
        const off=el('<button class="cal-action-btn" title="감독없는 날로 지정">🚫</button>');
        regen.onclick=ev=>{ev.stopPropagation();runAssignment('from',id);};off.onclick=ev=>{ev.stopPropagation();designateHoliday(id);};
        actions.append(regen,off);cell.appendChild(actions);
      }
      cell.addEventListener('click',()=>openDayModal(id));
    }
    grid.appendChild(cell);
  }
  box.appendChild(grid);return box;
}

function cellEl(dateId,teacherId){
  const loc=getAssign(dateId,teacherId), div=document.createElement('div');
  div.className='cell '+(loc||'empty');
  div.textContent=loc ? (gs().mode==='single'?'감독':loc==='교사동'?'교':'베') : '·';
  if(swapMode&&swapSelection&&swapSelection.dateId===dateId&&swapSelection.teacherId===teacherId) div.classList.add('selected');
  div.onclick=()=>handleCellClick(dateId,teacherId);return div;
}

}

document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;swapSelection=null;calSelection=null;render();});
document.getElementById('undoBtn').onclick=undo;
document.getElementById('swapModeBtn').onclick=()=>{swapMode=!swapMode;swapSelection=null;render();};
document.getElementById('autoGenBtn').onclick=()=>checkPasswordThen(`${currentGrade}학년 전체 자동배정`,()=>runAssignment('full',null));
document.getElementById('resetBtn').onclick=()=>checkPasswordThen(`${currentGrade}학년 초기화`,()=>{
  if(!confirm(`${currentGrade}학년 데이터를 초기 상태로 되돌릴까요?`)) return;
  pushUndo();const fresh=makeGradeState(currentGrade);gs().teachers=fresh.teachers;gs().dates=fresh.dates;gs().assignments=fresh.assignments;gs().mode=fresh.mode;
  if(currentGrade!=='2') runAssignment('full',null,{silent:true,noUndo:true});
  else runAssignment('full',null,{silent:true,noUndo:true});
  saveState();render();
});

appState=loadLocal()||defaultRootState();
render();
initRealtimeSync();
</script>
</body>
</html>
